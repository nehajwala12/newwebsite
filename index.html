    -webkit-appearance:none;margin:0}
  .twk-num-unit{padding-right:8px;color:rgba(41,38,27,.45)}

  .twk-btn{appearance:none;height:26px;padding:0 12px;border:0;border-radius:7px;
    background:rgba(0,0,0,.78);color:#fff;font:inherit;font-weight:500;cursor:default}
  .twk-btn:hover{background:rgba(0,0,0,.88)}
  .twk-btn.secondary{background:rgba(0,0,0,.06);color:inherit}
  .twk-btn.secondary:hover{background:rgba(0,0,0,.1)}

  .twk-swatch{appearance:none;-webkit-appearance:none;width:56px;height:22px;
    border:.5px solid rgba(0,0,0,.1);border-radius:6px;padding:0;cursor:default;
    background:transparent;flex-shrink:0}
  .twk-swatch::-webkit-color-swatch-wrapper{padding:0}
  .twk-swatch::-webkit-color-swatch{border:0;border-radius:5.5px}
  .twk-swatch::-moz-color-swatch{border:0;border-radius:5.5px}
`;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<script type="text/babel" data-src="visuals.jsx">
// visuals.jsx — small sub-visuals used in cards and panels

function Sparkline({ data, width = 320, height = 80, predFrom = 0.6 }) {
  const max = Math.max(...data);
  const min = Math.min(...data);
  const r = max - min || 1;
  const stepX = width / (data.length - 1);
  const pts = data.map((v, i) => [i * stepX, height - ((v - min) / r) * (height - 12) - 6]);
  const cut = Math.floor(data.length * predFrom);
  const past = pts.slice(0, cut + 1);
  const fut = pts.slice(cut);
  const toPath = (arr) => arr.map((p, i) => `${i === 0 ? "M" : "L"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
  const areaPath = `${toPath(past)} L${past[past.length - 1][0]} ${height} L0 ${height} Z`;
  return (
    <svg className="spark" viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none">
      <path className="area" d={areaPath} />
      <path className="line" d={toPath(past)} />
      <path className="line pred" d={toPath(fut)} />
    </svg>
  );
}

function MiniBars({ values, accent = false }) {
  const max = Math.max(...values);
  return (
    <div style={{display:"flex",alignItems:"flex-end",gap:6,height:80,width:"100%"}}>
      {values.map((v,i)=>(
        <div key={i} style={{
          flex:1,
          height: `${(v/max)*100}%`,
          background: accent ? "var(--accent)" : "var(--ink-2)",
          opacity: accent ? (0.45 + (i/values.length)*0.55) : 0.18 + (v/max)*0.5,
          borderRadius: 3,
          transition:"height 280ms ease"
        }}/>
      ))}
    </div>
  );
}

function StatLine({ label, value, delta }) {
  return (
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",padding:"10px 0",borderBottom:"1px solid var(--line)"}}>
      <span style={{color:"var(--ink-3)",fontSize:13}}>{label}</span>
      <span style={{display:"flex",gap:10,alignItems:"baseline"}}>
        <span style={{fontWeight:600,fontSize:15,letterSpacing:"-0.01em"}}>{value}</span>
        {delta && <span style={{fontSize:12,color: delta.startsWith("+") ? "#16a34a" : "#dc2626"}}>{delta}</span>}
      </span>
    </div>
  );
}

function fmt(n, isPct) {

function fmtDelta(d, isPct) {

<script type="text/babel" data-src="agent_visuals.jsx">
// agent_visuals.jsx — each agent rendered as a cropped slice of real product UI:
// layered glass panels, gradient charts that draw in on scroll, conic donuts,
// tooltips, a cursor, brand color, and subtle ambient motion. Tokens carry
// through dark mode + the accent tweak. Respects prefers-reduced-motion.

const { useRef: useRefAV, useState: useStateAV, useEffect: useEffectAV } = React;
const ACC = "var(--accent)";
const GOOD = "#22c55e";
const VizCtx = React.createContext(false);
const useSeen = () => React.useContext(VizCtx);

function useInView() {
  const ref = useRefAV(null);
  const [seen, setSeen] = useStateAV(false);
  useEffectAV(() => {
    const el = ref.current;
    if (!el || seen) return;
    if (!("IntersectionObserver" in window)) { setSeen(true); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } });
    }, { threshold: 0.3 });
    io.observe(el);
    return () => io.disconnect();
  }, [seen]);
  return [ref, seen];
}

const REDUCED = typeof window !== "undefined" &&
  window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// count a number up when `run` flips true
function useCount(target, run, dur = 1000) {
  const [v, setV] = useStateAV(REDUCED ? target : 0);
  useEffectAV(() => {
    if (!run || REDUCED) { setV(target); return; }
    let raf, t0;
    const tick = (t) => {
      if (!t0) t0 = t;
      const p = Math.min(1, (t - t0) / dur);
      setV(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [run, target]);
  return v;
}

function Count({ run, value, fmt }) {
  const v = useCount(value, run);
  return <React.Fragment>{fmt(v)}</React.Fragment>;
}

// Catmull-Rom → cubic bezier for buttery chart curves
function smooth(pts) {
  if (pts.length < 2) return "";
  const d = [`M${pts[0].x},${pts[0].y}`];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d.push(`C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x},${p2.y}`);
  }
  return d.join(" ");
}

function AreaChart({ gid, pts, cut }) {
  const H = 64;
  const solid = cut != null ? pts.slice(0, cut + 1) : pts;
  const tail = cut != null ? pts.slice(cut) : null;
  const solidLine = smooth(solid);
  const areaD = `${smooth(pts)} L${pts[pts.length - 1].x},${H} L${pts[0].x},${H} Z`;
  return (
    <svg className="av-spark" viewBox={`0 0 300 ${H}`} preserveAspectRatio="none">
      <defs>
        <linearGradient id={gid} x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stopColor={ACC} stopOpacity="0.36"/>
          <stop offset="0.7" stopColor={ACC} stopOpacity="0.06"/>
          <stop offset="1" stopColor={ACC} stopOpacity="0"/>
        </linearGradient>
      </defs>
      {[16, 32, 48].map((y) => (
        <line key={y} x1="0" y1={y} x2="300" y2={y} stroke="var(--ink)" strokeOpacity="0.06"
          strokeWidth="1" vectorEffect="non-scaling-stroke"/>
      ))}
      <path className="av-area" d={areaD} fill={`url(#${gid})`}/>
      <path className="av-draw" d={solidLine} pathLength="1" fill="none" stroke={ACC}
        strokeWidth="2.5" vectorEffect="non-scaling-stroke" strokeLinecap="round" strokeLinejoin="round"/>
      {tail && (
        <path d={smooth(tail)} pathLength="1" fill="none" stroke={ACC} strokeWidth="2.5"
          strokeDasharray="0.018 0.03" strokeOpacity="0.7" vectorEffect="non-scaling-stroke"
          strokeLinecap="round" strokeLinejoin="round"/>
      )}
    </svg>
  );
}

  creative: VCreative, returns: VReturns, cx: VCx, close: VClose,
};

function AgentViz({ kind, replayOnHover = true }) {
  const C = AGENT_VIZ[kind];
  const [ref, seen] = useInView();
  const rootRef = useRefAV(null);
  const [replay, setReplay] = useStateAV(0);

  const onEnter = () => {
    if (!REDUCED && replayOnHover) setReplay((k) => k + 1);
  };
  const onMove = (e) => {
    const root = rootRef.current;
    if (!root || REDUCED) return;
    const r = root.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    root.classList.add("tilting");
    root.style.setProperty("--ry", (px * 11).toFixed(2) + "deg");
    root.style.setProperty("--rx", (-py * 11).toFixed(2) + "deg");
    root.style.setProperty("--sx", ((e.clientX - r.left) / r.width * 100).toFixed(1) + "%");
    root.style.setProperty("--sy", ((e.clientY - r.top) / r.height * 100).toFixed(1) + "%");
  };
  const onLeave = () => {
    const root = rootRef.current;
    if (!root) return;
    root.classList.remove("tilting");
    root.style.setProperty("--ry", "0deg");
    root.style.setProperty("--rx", "0deg");
  };

  if (!C) return null;
  return (
    <VizCtx.Provider value={seen}>
      <div
        ref={(n) => { ref.current = n; rootRef.current = n; }}
        className={"av-root" + (seen ? " is-in" : "")}
        onMouseEnter={onEnter}
        onMouseMove={onMove}
        onMouseLeave={onLeave}
      >
        <span className="av-glow v"/>
        <span className="av-glow"/>
        <C key={replay}/>
        <span className="av-spot"/>
      </div>
    </VizCtx.Provider>
  );
}

window.AgentViz = AgentViz;

const { useRef: useRefV, useState: useStateV, useEffect: useEffectV } = React;

function VideoModal() {
  const ref = useRefV(null);
  const [open, setOpen] = useStateV(false);
  const [clip, setClip] = useStateV({ src: "", title: "" });

  useEffectV(() => {
    window.openAgentVideo = (opts = {}) => {
      setClip({ src: opts.src || "", title: opts.title || "Agent" });
      setOpen(true);
    };
    return () => { delete window.openAgentVideo; };
  }, []);

  useEffectV(() => {
    if (!open) return;
    document.body.style.overflow = "hidden";
    const v = ref.current;
    if (v) {
      v.currentTime = 0;
      v.muted = false;
      const p = v.play();
      if (p && p.catch) p.catch(() => { v.muted = true; v.play(); });
    }
    const onKey = (e) => { if (e.key === "Escape") close(); };
    window.addEventListener("keydown", onKey);
    return () => { document.body.style.overflow = ""; window.removeEventListener("keydown", onKey); };
  }, [open]);

  const close = () => {
    const v = ref.current;
    if (v) v.pause();
    setOpen(false);

  if (!open) return null;

  return (
    <div className="vid-scrim" onClick={(e) => { if (e.target === e.currentTarget) close(); }}>
      <div className="vid-modal" role="dialog" aria-label={clip.title + " demo"}>

<script type="text/babel" data-src="emailform.jsx">
// emailform.jsx — reusable email capture form
// Posts to one of three configurable endpoints:
//   - Google Apps Script Web App URL  (writes to a Google Sheet)
//   - Formspree / Getform / Basin     (any "form to email/db" service)
//   - Your own backend                (POST JSON {email, source})
// If no endpoint is configured, it falls back to localStorage (demo mode).
//
// Configure in Converts AI.html via window.CONVERTS_FORM_ENDPOINT.

const { useState: useStateE } = React;

async function submitEmail(email, source) {
  const endpoint = window.CONVERTS_FORM_ENDPOINT;
  const payload = { email, source, ts: new Date().toISOString() };

  // No endpoint configured: store locally (demo / preview)
  if (!endpoint || endpoint.startsWith("PASTE_")) {
    const key = "converts_waitlist";
    const prev = JSON.parse(localStorage.getItem(key) || "[]");
    prev.push(payload);
    localStorage.setItem(key, JSON.stringify(prev));
    console.log("[Converts AI] No endpoint set — saved locally.", payload);
    await new Promise(r => setTimeout(r, 500));
    return { ok: true, local: true };
  }

  // Google Apps Script + Formspree both accept POST with form-encoded data.
  // We use 'no-cors' for Apps Script so the browser doesn't choke on the
  // missing CORS header; we can't read the response but the row gets written.
  const body = new FormData();
  Object.entries(payload).forEach(([k,v]) => body.append(k, v));

  const isAppsScript = endpoint.includes("script.google.com");
  try {
    await fetch(endpoint, {
      method: "POST",
      body,
      mode: isAppsScript ? "no-cors" : "cors",
      headers: isAppsScript ? undefined : { Accept: "application/json" },
    });
  } catch (e) {
    // Submission still reaches the endpoint even if the response can't be read.
  }
  return { ok: true };
}

function EmailForm({ source = "hero", placeholder = "Enter your work email", cta = "Get early access", onLight = true }) {
  const [email, setEmail] = useStateE("");
  const [state, setState] = useStateE("idle"); // idle | loading | ok | err
  const [msg, setMsg] = useStateE("");

  async function onSubmit(e) {
    e.preventDefault();
    if (!email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
      setState("err"); setMsg("Please enter a valid email."); return;
    }
    setState("loading"); setMsg("");
    try {
      const r = await submitEmail(email, source);
      setState("ok");
      setMsg(r.local
        ? "Saved locally — connect an endpoint to capture real emails."
        : "You're on the list. We'll be in touch.");
      setEmail("");
    } catch (err) {
      setState("err"); setMsg("Something went wrong. Try again?");
    }
  }

  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
      <form className="email-form" onSubmit={onSubmit}>
        <input
          type="email"
          inputMode="email"
          autoComplete="email"
          placeholder={placeholder}
          value={email}
          onChange={(e)=>setEmail(e.target.value)}
          required
        />
        <button className="btn btn-primary" type="submit" disabled={state==="loading"}>
          {state==="loading" ? "Sending…" : cta}
        </button>
      </form>
      <div className={`email-form-msg ${state==="ok"?"is-ok":""} ${state==="err"?"is-err":""}`}>
        {state==="ok" && <Icon.Check/>}
        <span>{msg || (state==="idle" ? "Free 14-day trial · no credit card" : "")}</span>
      </div>
    </div>
  );
}

window.EmailForm = EmailForm;

</script>

const { useRef: useRefP, useState: useStateP2, useEffect: useEffectP } = React;

const REDUCED_PE = typeof window !== "undefined" && window.matchMedia &&
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function useReveal(threshold = 0.25) {
  const ref = useRefP(null);
  const [shown, setShown] = useStateP2(false);
  useEffectP(() => {
    const el = ref.current;
    if (!el || shown) return;
    if (REDUCED_PE || !("IntersectionObserver" in window)) { setShown(true); return; }
    const io = new IntersectionObserver((es) => {
      es.forEach((e) => { if (e.isIntersecting) { setShown(true); io.disconnect(); } });
    }, { threshold });
    io.observe(el);
    return () => io.disconnect();
  }, [shown, threshold]);
  return [ref, shown];
}

function useCountP(target, run, dur = 1100) {
  const [v, setV] = useStateP2(REDUCED_PE ? target : 0);
  useEffectP(() => {
    if (!run || REDUCED_PE) { setV(target); return; }
    let raf, t0;
    const tick = (t) => {
      if (!t0) t0 = t;
      const p = Math.min(1, (t - t0) / dur);
      setV(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [run, target]);
  return v;
}

// HeroReel — looping "video": cycles the 4 agent levers, then pans the P&L.
const REEL_STEPS = [
  { type: "pnl", dur: 3800 },
  { type: "console", lever: 0, dur: 3000 },
];
function HeroReel() {
  const [i, setI] = useStateP2(0);
  const [paused, setPaused] = useStateP2(false);
  useEffectP(() => {
    if (paused || REDUCED_PE) return;
    const id = setTimeout(() => setI((p) => (p + 1) % REEL_STEPS.length), REEL_STEPS[i].dur);
    return () => clearTimeout(id);
  }, [i, paused]);
  const step = REEL_STEPS[i];
  const lever = step.type === "console" ? step.lever : 0;
  const isPnl = step.type === "pnl";
  return (
    <div className="reel" onMouseEnter={() => setPaused(true)} onMouseLeave={() => setPaused(false)}>
      <div className={"reel-layer" + (!isPnl ? " is-on" : "")}>
        <AgentConsole active={lever} onSelect={(n) => { setI(n); }} />
      </div>
      <div className={"reel-layer" + (isPnl ? " is-on" : "")}>
        <ReelPnl active={isPnl} dur={REEL_STEPS[0].dur - 900} />
      </div>
      {isPnl && (
        <span className="reel-cursor" style={{ "--dur": REEL_STEPS[0].dur + "ms" }} aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 16 16"><path d="M2 1.5 L13 7 L8.2 8.4 L6.4 13 Z" fill="#1d1d1f" stroke="#fff" strokeWidth="1.2" strokeLinejoin="round"/></svg>
          <span className="rc-ring" />
        </span>
      )}
      <div className="reel-bar" aria-hidden="true">
        {REEL_STEPS.map((s, n) => (
          <span key={n} className={"reel-seg" + (n < i ? " done" : "") + (n === i ? " active" : "")}

        ))}
      </div>
    </div>
  );
}

function useBarAnim(shown) {
  const [on, setOn] = useStateP2(false);
  useEffectP(() => {
    if (!shown) return;
    const r = requestAnimationFrame(() => requestAnimationFrame(() => setOn(true)));
    return () => cancelAnimationFrame(r);
  }, [shown]);
  return on;
}

function CalibrationChart({ rows, shown }) {
  const on = useBarAnim(shown);
  const max = Math.max(...rows.flatMap((r) => [r.pred, r.act])) * 1.1;
  return (
    <div>
      <div className="cal-rows">
        {rows.map((r) => {
          const bias = ((r.pred - r.act) / r.act) * 100;
          return (
            <div className="cal-row" key={r.wk}>
              <span className="cal-wk">{r.wk}</span>
              <div className="cal-track">

function hexToRGBp(hex) {
  const h = hex.replace("#", "");
  const v = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
  const n = parseInt(v, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function csTimingVars(i, n) {

}

/* sequential timing — each agent runs & resolves before the next begins */
function csTimingVarsSeq(i, n) {
  const step = (n + 2) * 0.26 + 0.6 + 0.7 + 0.2; // full run + flip + breath

  const flip = linebase + (n + 2) * 0.26 + 0.6;
  return { "--appear": appear + "s", "--linebase": linebase + "s", "--flip": flip + "s" };

/* ── Makeshift 5 — ONE card at a time; it tears away when done, next replaces it ── */
function CSMake5({ lit }) {
  const [idx, setIdx] = useStateP2(0);
  const [nonce, setNonce] = useStateP2(0);
  const startRef = useRefP(0);
  useEffectP(() => {
    if (!lit || REDUCED_PE) return;
    let cancelled = false;
    const timers = [];
    function play(i) {
      if (cancelled) return;
      setIdx(i);
      const d = INDUSTRIES[i];
      const n = d.out.length;
      const lb = 0.55;
      const outbase = lb + (n + 2) * 0.24 + 0.3;
      const settled = outbase + (n - 1) * 0.26 + 0.5;
      const hold = 1.0;
      timers.push(setTimeout(() => { if (!cancelled) play((i + 1) % INDUSTRIES.length); }, (settled + hold) * 1000));
    }
    play(startRef.current);
    return () => { cancelled = true; timers.forEach(clearTimeout); };
  }, [lit, nonce]);

  const pick = (i) => { if (i === idx) return; startRef.current = i; setIdx(i); setNonce((c) => c + 1); };

  const d = INDUSTRIES[idx];
  const n = d.out.length;
  const lb = 0.55;
  const outbase = lb + (n + 2) * 0.24 + 0.3;
  const card = (
    <article className="m4-row m5-card" style={{ ...csStyle(d, idx), "--rowin": "0s", "--linebase": lb + "s", "--outbase": outbase + "s" }}>
      <div className="m4-term"><TermShell d={d} /></div>
      <div className="m4-hero">
        <span className="m4-hero-name">{d.agent} <span className="csb-tag">Agent</span></span>
        <div className="m4-stats">
          {d.out.map((o, j) => (
            <div className="m4-stat" key={j} style={{ "--si": j }}>
              <span className="m4-stat-v">{o.v}</span>
              <span className="m4-stat-l">{o.l}</span>
            </div>
          ))}
        </div>
      </div>
    </article>
  );

  return (
    <div className="m5-stage">
      <div className="m5-cats" role="tablist">
        {INDUSTRIES.map((x, i) => (
          <button key={x.key} type="button" role="tab" aria-selected={i === idx}
            className={"m5-cat-tab" + (i === idx ? " is-on" : "")} style={{ "--accent": x.accent }}
            onClick={() => pick(i)}>{x.tab}</button>
        ))}
      </div>
      <div className="m4-list is-run m5-run" key={"run" + idx}>{card}</div>
    </div>
  );
}

/* ── Makeshift 6 — ONE card; terminals run sequentially inside it, outcomes accumulate on the right ── */
function CSMake6({ lit }) {
  const N = INDUSTRIES.length;
  const [active, setActive] = useStateP2(REDUCED_PE ? N - 1 : 0);
  const [resolved, setResolved] = useStateP2(REDUCED_PE ? N : 0);
  const [cycle, setCycle] = useStateP2(0);
  useEffectP(() => {
    if (!lit || REDUCED_PE) return;
    let cancelled = false;
    const timers = [];
    const t = (fn, ms) => timers.push(setTimeout(() => { if (!cancelled) fn(); }, ms));
    function run(i) {
      if (cancelled) return;
      setActive(i);
      const d = INDUSTRIES[i];
      const n = d.out.length;
      const termDone = 0.2 + (n + 1) * 0.24 + 0.5; // terminal finishes typing
      t(() => setResolved(i + 1), termDone * 1000);
      const hold = 1.0;
      if (i + 1 < N) {
        t(() => run(i + 1), (termDone + hold) * 1000);
      } else {
        t(() => { setActive(0); setResolved(0); setCycle((c) => c + 1); }, (termDone + 2.6) * 1000);
      }
    }
    run(0);
    return () => { cancelled = true; timers.forEach(clearTimeout); };
  }, [lit, cycle]);

  const ad = INDUSTRIES[active];
  return (
    <div className="m5-stage">
      <div className="m5-progress">
        {INDUSTRIES.map((x, i) => (
          <span key={x.key} className={"m5-pip" + (i < resolved ? " is-on" : (i === active ? " is-run" : ""))} style={{ "--accent": x.accent }} />
        ))}
      </div>
      <article className="m4-row m6-row" style={csStyle(ad, active)}>
        <div className="m4-list is-run m6-termwrap" key={"t" + cycle + "-" + active} style={{ "--linebase": "0.2s" }}>
          <div className="m4-term m6-term"><TermShell d={ad} /></div>
        </div>
        <div className="m6-acc">
          {INDUSTRIES.slice(0, resolved).map((d, i) => (
            <div className="m6-block" key={"b" + cycle + "-" + i} style={csStyle(d, i)}>
              <span className="m4-hero-name">{d.agent} <span className="csb-tag">Agent</span></span>
              <div className="m4-stats m6-bstats">
                {d.out.map((o, j) => (
                  <div className="m4-stat" key={j}>
                    <span className="m4-stat-v">{o.v}</span>
                    <span className="m4-stat-l">{o.l}</span>
                  </div>
                ))}
              </div>
            </div>
          ))}
          {resolved <= active && (
            <div className="m6-pending" key={"p" + cycle + "-" + active}>
              <span className="m6-pending-dot" style={{ "--accent": ad.accent }} />
              <span className="m6-pending-t">{ad.agent} · resolving…</span>
            </div>
          )}
        </div>
      </article>
    </div>
  );
}

      { n: "Supplier Scout", role: "Sourcing", d: "Sources cheaper, reliable suppliers for every SKU.", k: "−26% unit cost", m: "SC" },
    ] },
  { key: "mkt", name: "Boost marketing ROAS", color: "#6d28d9", roi: "+50%", roiUnit: "ROAS", line: "Make every ad dollar work harder.", viz: "roas", video: "media/roas-allocator.mp4",
    agents: [
      { n: "ROAS Allocator", role: "Media buying", d: "Moves spend to the channels and audiences that return.", k: "4.8× on Meta", m: "RA" },
      { n: "Copy Studio", role: "Copywriting", d: "Generates on-brand ad and email copy that converts.", k: "+12% CVR", m: "CO" },
      { n: "Creative Studio", role: "Creative", d: "Produces and tests ad creative at scale.", k: "5× output", m: "CR" },
    ] },
  { key: "ga", name: "Reduce G&A", color: "#c2410c", roi: "−42%", roiUnit: "MANUAL HOURS", line: "Cut the manual overhead.", viz: "cx", video: "media/cx-triage.mp4",
    agents: [
      { n: "Returns Concierge", role: "Returns", d: "Resolves returns into exchanges and saves the sale.", k: "−$58 / return", m: "RC" },
      { n: "CX Triage", role: "Support", d: "Auto-resolves the majority of support tickets.", k: "86% auto-resolved", m: "CX" },
      { n: "Monthly Close", role: "Finance", d: "Reconciles and closes the books in days, not weeks.", k: "−6 days to close", m: "MC" },
    ] },
];

function hexSoft(hex, a = 0.1) {
  const [r, g, b] = hexToRGBp(hex);
  return `rgba(${r},${g},${b},${a})`;
}

function slugify(s) {
  return s.toLowerCase().replace(/&/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

function LeverVideo({ src }) {
  const ref = useRefP(null);
  useEffectP(() => {
    const v = ref.current;
    if (!v) return;
    v.muted = true;
    const go = () => { const p = v.play(); if (p && p.catch) p.catch(() => {}); };
    go();
    v.addEventListener("canplay", go, { once: true });
    return () => v.removeEventListener("canplay", go);
  }, [src]);
  return <video ref={ref} className="lev-video" src={src} autoPlay muted loop playsInline preload="auto" />;
}

const SUITS = ["♦", "♣", "♠", "♥"];

// each agent → a glyph that reflects its job (replaces the 2-letter monogram)
const AGENT_ICON = {
  "Demand Forecaster": "Chart",
  "Traffic Driver": "Globe",
  "Subscription Strategist": "Repeat",
  "Listing Optimizer": "Tag",
  "Bundle Architect": "Box",
  "Inventory Balancer": "Boxes",
  "Price Comp Scout": "Target",
  "Promotion Optimizer": "Megaphone",
  "Supplier Scout": "Truck",
  "ROAS Allocator": "Chart",
  "Copy Studio": "Pen",
  "Creative Studio": "Image",
  "Returns Concierge": "Return",
  "CX Triage": "Chat",
  "Monthly Close": "Calendar",
};

function EcomROI() {
  const [phase, setPhase] = useStateP2("idle"); // idle -> deal -> open
  const [open, setOpen] = useStateP2(0);
  const [sel, setSel] = useStateP2(0);
  const ref = useRefP(null);
  const accRef = useRefP(null);
  useEffectP(() => { setSel(0); }, [open]);
  useEffectP(() => {
    if (phase !== "open" || REDUCED_PE) return;
    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        ticking = false;
        if (window.innerWidth <= 820) return;
        const track = accRef.current;
        if (!track) return;
        const total = track.offsetHeight - window.innerHeight;
        if (total <= 0) return;
        const scrolled = Math.min(Math.max(-track.getBoundingClientRect().top, 0), total);
        const idx = Math.min(ROI_LEVERS.length - 1, Math.floor((scrolled / total) * ROI_LEVERS.length * 0.999));
        setOpen(idx);
      });
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, [phase]);
  useEffectP(() => {
    if (REDUCED_PE) { setPhase("open"); return; }
    let done = false; const timers = [];
    const check = () => {
      if (done) return;
      const el = ref.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight * 0.72 && r.bottom > 0) {
        done = true;
        window.removeEventListener("scroll", check);
        timers.push(setTimeout(() => setPhase("deal"), 600));
        timers.push(setTimeout(() => setPhase("hero"), 2350));
        timers.push(setTimeout(() => setPhase("gather"), 3750));
        timers.push(setTimeout(() => setPhase("open"), 4750));
      }
    };
    window.addEventListener("scroll", check, { passive: true });
    check();
    return () => { window.removeEventListener("scroll", check); timers.forEach(clearTimeout); };
  }, []);

  return (
    <section className="section agents2" id="agents" ref={ref}>
      {phase !== "open" ? (
        <div className="container">
          <div className="agents2-head">
            <p className="eyebrow">AI Agents for Commerce</p>
            <h2 className="h-section">Outcomes driven by our agents.</h2>
            <p className="lede" style={{ margin: "20px auto 0", maxWidth: 560 }}>Converts Agents run inside your stack and move every line of your P&amp;L.</p>
          </div>
          <div className={"deal-stage" + (phase === "deal" || phase === "hero" ? " is-dealing" : "") + (phase === "gather" ? " is-gathering" : "")} aria-hidden="true">
            {ROI_LEVERS.map((l, n) => (
              <div className={"pcard deal-card" + (phase === "hero" && n === 0 ? " is-hero" : "")} key={l.key} style={{ "--lc": l.color, "--i": n }}>
                <span className="pcard-corner tl"><b className="pcard-rank">{l.agents.length}</b><i className="pcard-suit-sm">{SUITS[n]}</i></span>
                <span className="pcard-center">{SUITS[n]}</span>
                <span className="pcard-name">{l.name}</span>
                <span className="pcard-roi">{l.roi}<span> {l.roiUnit}</span></span>
                <span className="pcard-corner br"><b className="pcard-rank">{l.agents.length}</b><i className="pcard-suit-sm">{SUITS[n]}</i></span>
              </div>
            ))}
          </div>
        </div>
      ) : (
        <div className="agents-track" ref={accRef}>
          <div className="agents-sticky">
            <div className="container">
              <div className="agents2-head">
                <p className="eyebrow">AI Agents for Commerce</p>
                <h2 className="h-section">Outcomes driven by our agents.</h2>
                <p className="lede" style={{ margin: "20px auto 0", maxWidth: 560 }}>Converts Agents run inside your stack and move every line of your P&amp;L.</p>
              </div>
              <div className="acc deal-open">
                {ROI_LEVERS.map((l, n) => {
                  const isOpen = open === n;
                  const a = l.agents[isOpen ? sel : 0];
                  return (
                    <div className={"acc-item" + (isOpen ? " is-open" : "")} key={l.key}
                      style={{ "--lc": l.color, "--accent": l.color, "--accent-soft": hexSoft(l.color, 0.12), "--lc-soft": hexSoft(l.color, 0.12) }}>
                      <button className="acc-head" aria-expanded={isOpen} onClick={() => setOpen(isOpen ? -1 : n)}>
                        <span className="acc-suit">{SUITS[n]}</span>
                        <span className="acc-name">{l.name}</span>
                        <span className="acc-line">{l.line}</span>
                        <span className="acc-count">{l.agents.length} agents</span>
                        <span className="acc-roi">{l.roi}<span>{l.roiUnit}</span></span>
                        <span className="acc-chev" aria-hidden="true">›</span>
                      </button>
                      <div className="acc-body">
                        <div className="acc-inner">
                          <div className="acc-grid">
                            <div className="acc-viz">{isOpen && <LeverVideo src={"media/" + slugify(a.n) + ".mp4"} />}</div>
                            <div className="acc-agents">
                              <div className="acc-agents-head"><Icon.Sparkle /> {l.agents.length} AI agents on the job</div>
                              <div className="acc-aglist">
                                {l.agents.map((ag, i) => (
                                  <button className={"acc-ag" + (isOpen && sel === i ? " is-sel" : "")} key={ag.n}
                                    style={{ transitionDelay: (isOpen ? 0.06 + i * 0.04 : 0) + "s" }}
                                    onClick={() => setSel(i)}>
                                    <span className="acc-mono">{(() => { const Ic = Icon[AGENT_ICON[ag.n]]; return Ic ? <Ic width={20} height={20} /> : ag.m; })()}</span>
                                    <span className="acc-agmain">
                                      <span className="acc-agname">{ag.n}</span>
                                      <span className="acc-agrole">{ag.role}</span>
                                    </span>
                                    <span className="acc-agk">{ag.k}</span>
                                  </button>
                                ))}
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      )}
    </section>
  );
}

Object.assign(window, { PortfolioProof, WhatIf, AgentConsole, HeroReel, HeroBridge, HeroPnl, HeroScreen, EcomROI, CaseStudy, WhyUs, Enterprise });
</script>
<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#0066cc",
  "headline": "classic",
  "dark": false
}/*EDITMODE-END*/;

function hexToRGB(hex) {
  const h = hex.replace("#","");
  const v = h.length === 3 ? h.split("").map(c=>c+c).join("") : h;
  const n = parseInt(v,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  useEffect(() => {
    const root = document.documentElement;
    root.dataset.theme = t.dark ? "dark" : "light";
    root.style.setProperty("--accent", t.accent);
    const [r,g,b] = hexToRGB(t.accent);
    root.style.setProperty("--accent-soft", `rgba(${r},${g},${b},0.10)`);
  }, [t.accent, t.dark]);

  return (
    <>
      <Nav />
      <Hero headline={t.headline} />
      <HeroTrust />
      <CaseStudy />
      <EcomROI />
      <FinalCTA />
      <Foot />
      <TalkModal />
      <VideoModal />

      <TweaksPanel>
        <TweakSection label="Hero"/>
        <TweakRadio label="Headline" value={t.headline}
          options={[{value:"classic",label:"EBITDA"},{value:"proof",label:"Proof"}]}
          onChange={(v)=>setTweak("headline",v)}/>
        <TweakSection label="Theme"/>
        <TweakColor label="Accent" value={t.accent} onChange={(v)=>setTweak("accent",v)}/>
        <TweakToggle label="Dark mode" value={t.dark} onChange={(v)=>setTweak("dark",v)}/>
      </TweaksPanel>
    </>
  );
}

function Nav() {
  return (
    <nav className="nav">
      <div className="nav-inner">
        <a className="nav-brand" href="#">
          <img className="nav-logo" src="media/logo.png" alt="converts.ai"/>
          <span>Converts AI</span>
        </a>
        <ul className="nav-links">
          <li><a href="#proof">Case studies</a></li>
          <li><a href="#agents">Agents</a></li>
        </ul>
        <div className="nav-cta">
          <a href="#" style={{fontSize:13,color:"var(--ink-2)"}}>Sign in</a>
          <button className="btn btn-primary btn-sm" onClick={()=>window.openTalkModal({source:"nav"})}>Talk to us</button>
        </div>
      </div>

  );
}

const HERO_HEADLINES = {
  classic: ["Grow EBITDA,", "not headcount."],
  proof: ["+20% forecast accuracy.", "~$4M a year. Proven."],
};

function HeroRotator() {
  const PHRASES = [
    { ic: <Icon.Bolt/>,    lead: "Marketing agents that",   out: "boost ROAS" },
    { ic: <Icon.Tag/>,     lead: "Pricing agents that",     out: "drive margin" },
    { ic: <Icon.Chart/>,   lead: "Forecasting agents that", out: "increase revenue" },
    { ic: <Icon.Sparkle/>, lead: "Support agents that",     out: "lower returns" },
  ];
  const reduce = typeof window !== "undefined" && window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const [idx, setIdx] = useState(0);
  const [prev, setPrev] = useState(-1);
  useEffect(() => {
    if (reduce) return;
    const id = setInterval(() => {
      setIdx((i) => { setPrev(i); return (i + 1) % PHRASES.length; });
    }, 2800);
    return () => clearInterval(id);
  }, []);
  return (
    <div className="hero-rot" aria-label="What our agents do">
      {PHRASES.map((p, i) => {
        const cls = i === idx ? " is-on" : (i === prev ? " is-out" : "");
        return (
          <div key={i} className={"hero-rot-line" + cls} aria-hidden={i !== idx}>
            <span className="hero-rot-ic">{p.ic}</span>
            <span className="hero-rot-lead">{p.lead} </span>
            <span className="hero-rot-out">{p.out}</span>
          </div>
        );
      })}
    </div>
  );
}

const HERO_ROT_COUNT = 4;

function Hero({ headline = "classic" }) {
  const [l1, l2] = HERO_HEADLINES[headline] || HERO_HEADLINES.classic;

      <div className="hero-bg"/>
      <div className="container hero-inner hero-split">
        <div className="hero-left">
          <h1 className="h-display">
            {l1.includes("EBITDA")
              ? l1.split(/(EBITDA)/).map((part, i) =>
                  part === "EBITDA"

                    : part)
              : l1}<br/>
            <span style={{color:"var(--ink-3)"}}>{l2}</span>
          </h1>
          <div className="hero-actions">
            <button className="btn btn-primary btn-lg" onClick={()=>window.openTalkModal && window.openTalkModal({source:"hero-proof"})}>See the Proof</button>
          </div>
        </div>
        <div className="hero-right">
          <HeroRotator/>
          <div className="hero-stage">
            <div className="prodframe">
              <div className="prodframe-bar">
                <span className="tl-dot r"/><span className="tl-dot y"/><span className="tl-dot g"/>
                <span className="prodframe-title"><Icon.Sparkle/> app.converts.ai / p&amp;l</span>
                <span className="prodframe-live"><span className="live-dot"/>agents running</span>
              </div>
              <HeroScreen/>
            </div>
          </div>
        </div>
      </div>
    </section>

}

function HeroTrust() {

  return (

          <span key={l.n} className="hero-trust-logo"><img src={l.src} alt={l.n}/></span>

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
