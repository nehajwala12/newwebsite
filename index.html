<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Converts AI — Agents for consumer brands, products and services</title>
<style>
/* Converts AI — Apple-esque marketing site */

:root {
  --bg: #ffffff;
  --bg-soft: #fbfbfd;
  --bg-elevated: #f5f5f7;
  --ink: #1d1d1f;
  --ink-2: #424245;
  --ink-3: #6e6e73;
  --ink-4: #86868b;
  --line: rgba(0, 0, 0, 0.08);
  --line-strong: rgba(0, 0, 0, 0.14);
  --accent: #0066cc;
  --accent-ink: #ffffff;
  --accent-soft: rgba(0, 102, 204, 0.08);

  --glass: rgba(255, 255, 255, 0.7);
  --glass-border: rgba(255, 255, 255, 0.6);

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04), 0 1px 1px rgba(0, 0, 0, 0.02);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.10), 0 2px 6px rgba(0, 0, 0, 0.04);

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --radius-xl: 28px;

  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
}

[data-theme="dark"] {
  --bg: #000000;
  --bg-soft: #060607;
  --bg-elevated: #131316;
  --ink: #f5f5f7;
  --ink-2: #d2d2d7;
  --ink-3: #a1a1a6;
  --ink-4: #6e6e73;
  --line: rgba(255, 255, 255, 0.10);
  --line-strong: rgba(255, 255, 255, 0.18);
  --accent: #2997ff;
  --accent-soft: rgba(41, 151, 255, 0.14);
  --glass: rgba(20, 20, 22, 0.7);
  --glass-border: rgba(255, 255, 255, 0.08);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.45), 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.3);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 17px;
  line-height: 1.47;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.01em;
  text-rendering: optimizeLegibility;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

button { font-family: inherit; cursor: default; }

::selection { background: var(--accent); color: var(--accent-ink); }

/* ───── Type scale (Apple-style) ───── */
.eyebrow {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 18px;
}
.h-display {
  font-size: clamp(48px, 7.6vw, 104px);
  line-height: 1.04;
  letter-spacing: -0.035em;
  font-weight: 600;
  margin: 0;
  text-wrap: balance;
}
.h-section {
  font-size: clamp(40px, 5vw, 72px);
  line-height: 1.06;
  letter-spacing: -0.028em;
  font-weight: 600;
  margin: 0;
  text-wrap: balance;
}
.h-card {
  font-size: clamp(26px, 2.4vw, 36px);
  line-height: 1.12;
  letter-spacing: -0.02em;
  font-weight: 600;
  margin: 0;
  text-wrap: balance;
}
.lede {
  font-size: clamp(19px, 1.6vw, 24px);
  line-height: 1.35;
  letter-spacing: -0.012em;
  color: var(--ink-2);
  font-weight: 400;
  text-wrap: pretty;
}
.kicker { color: var(--ink-3); }

/* ───── Layout ───── */
.container {
  width: 100%;
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 32px;
}
.container-wide { max-width: 1440px; }
.section { padding: 140px 0; position: relative; }
.section-tight { padding: 88px 0; }

/* ───── Buttons ───── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 44px;
  padding: 0 22px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.005em;
  border: 0;
  transition: transform 120ms ease, background 120ms ease, color 120ms ease, box-shadow 120ms ease;
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 102, 204, 0.32); text-decoration: none; }
.btn-ghost {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line-strong);
}
.btn-ghost:hover { background: var(--bg-elevated); text-decoration: none; }
.btn-sm { height: 34px; padding: 0 14px; font-size: 13px; }
.btn-link {
  background: transparent;
  color: var(--accent);
  padding: 0;
  height: auto;
}
.btn-link:hover { text-decoration: underline; }
.btn-link::after { content: " ›"; }

/* ───── Email form ───── */
.email-form {
  margin-top: 36px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 6px 6px 18px;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  box-shadow: var(--shadow-md);
  width: min(440px, 92vw);
  transition: border-color 160ms ease, box-shadow 160ms ease;
}
.email-form:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow-md);
}
.email-form input {
  flex: 1;
  min-width: 0;
  height: 44px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 15px;
  letter-spacing: -0.005em;
}
.email-form input::placeholder { color: var(--ink-4); }
.email-form .btn { flex-shrink: 0; }
.email-form-msg {
  margin: 14px auto 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 13.5px;
  color: var(--ink-3);
  min-height: 20px;
}
.email-form-msg.is-ok { color: #16a34a; }
.email-form-msg.is-err { color: #dc2626; }
.email-form-secondary {
  margin-top: 14px;
  font-size: 13px;
  color: var(--ink-3);
}
.email-form-secondary a { color: var(--ink-2); }

/* ───── Nav ───── */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  height: 52px;
  display: flex;
  align-items: center;
  background: rgba(255,255,255,0.72);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line);
}
[data-theme="dark"] .nav { background: rgba(0,0,0,0.72); }
.nav-inner {
  width: 100%;
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--ink);
}
.nav-brand:hover { text-decoration: none; }
.nav-links {
  display: flex;
  gap: 28px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.nav-links a {
  color: var(--ink-2);
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
.nav-links a:hover { color: var(--ink); text-decoration: none; }
.nav-cta { display: flex; gap: 10px; align-items: center; }

/* ───── Hero ───── */
.hero {
  position: relative;
  padding: 120px 0 100px;
  text-align: center;
  overflow: hidden;
}
.hero-bg {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(60% 40% at 20% 20%, rgba(120, 165, 255, 0.22), transparent 60%),
    radial-gradient(50% 50% at 80% 30%, rgba(199, 154, 255, 0.18), transparent 60%),
    radial-gradient(60% 40% at 50% 90%, rgba(120, 220, 220, 0.18), transparent 60%);
  filter: blur(40px);
  z-index: 0;
}
[data-theme="dark"] .hero-bg {
  background:
    radial-gradient(60% 40% at 20% 20%, rgba(60, 110, 255, 0.32), transparent 60%),
    radial-gradient(50% 50% at 80% 30%, rgba(170, 90, 255, 0.28), transparent 60%),
    radial-gradient(60% 40% at 50% 90%, rgba(40, 180, 200, 0.22), transparent 60%);
}
.hero-inner { position: relative; z-index: 1; }
.hero-cta { display: inline-flex; gap: 12px; margin-top: 36px; }

/* ───── Glass card ───── */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
}

/* ───── Mode split (Connected / Standalone) ───── */
.modes {
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
}
.mode-tabs {
  display: inline-flex;
  padding: 4px;
  background: var(--bg-elevated);
  border-radius: 999px;
  border: 1px solid var(--line);
  margin: 28px auto 0;
}
.mode-tab {
  padding: 9px 20px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-3);
  background: transparent;
  border: 0;
  transition: color 120ms ease, background 120ms ease;
}
.mode-tab[aria-selected="true"] {
  background: var(--bg);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}
.mode-stage {
  margin-top: 64px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.mode-card {
  position: relative;
  border-radius: var(--radius-xl);
  padding: 44px 40px;
  min-height: 520px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--bg-soft);
  display: flex;
  flex-direction: column;
}
.mode-card.is-connected {
  background:
    radial-gradient(120% 100% at 0% 0%, rgba(0, 102, 204, 0.10), transparent 60%),
    radial-gradient(120% 100% at 100% 100%, rgba(120, 80, 255, 0.08), transparent 60%),
    var(--bg-soft);
}
.mode-card.is-standalone {
  background:
    radial-gradient(120% 100% at 100% 0%, rgba(255, 200, 120, 0.10), transparent 60%),
    radial-gradient(120% 100% at 0% 100%, rgba(120, 220, 220, 0.10), transparent 60%),
    var(--bg-soft);
}
.mode-card .mode-eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  gap: 8px;
}
.mode-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.mode-card.is-standalone .mode-dot { background: #e8a663; box-shadow: 0 0 0 4px rgba(232,166,99,0.18); }
.mode-card h3 {
  font-size: 36px;
  letter-spacing: -0.02em;
  line-height: 1.1;
  font-weight: 600;
  margin: 16px 0 12px;
}
.mode-card p {
  color: var(--ink-2);
  font-size: 17px;
  line-height: 1.5;
  margin: 0 0 24px;
  max-width: 38ch;
}
.mode-card .mode-visual {
  margin-top: auto;
  flex: 1;
  min-height: 260px;
  position: relative;
}

/* ───── Use case grid ───── */
.uc-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 20px;
  margin-top: 64px;
}
.uc-card {
  position: relative;
  border-radius: var(--radius-xl);
  padding: 36px;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 380px;
  transition: transform 200ms ease, box-shadow 200ms ease;
}
.uc-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.uc-card.col-6 { grid-column: span 6; }
.uc-card.col-4 { grid-column: span 4; }
.uc-card.col-8 { grid-column: span 8; }
.uc-card.col-12 { grid-column: span 12; }
.uc-card.is-dark {
  background: #0a0a0c;
  color: #f5f5f7;
  border-color: rgba(255,255,255,0.08);
}
.uc-card.is-dark .kicker { color: rgba(255,255,255,0.6); }
.uc-card.is-dark p { color: rgba(255,255,255,0.7); }
.uc-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  background: var(--bg);
  border: 1px solid var(--line);
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-2);
  letter-spacing: 0.02em;
  width: fit-content;
}
.uc-tag.is-conn { color: var(--accent); border-color: rgba(0,102,204,0.25); background: var(--accent-soft); }
.uc-tag.is-stand { color: #c87a3a; border-color: rgba(200,122,58,0.3); background: rgba(232,166,99,0.10); }
.uc-card h3 {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.018em;
  line-height: 1.15;
  margin: 16px 0 10px;
}
.uc-card p {
  color: var(--ink-2);
  font-size: 15.5px;
  line-height: 1.5;
  margin: 0 0 20px;
}
.uc-visual {
  margin-top: auto;
  border-radius: var(--radius-md);
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 14px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-2);
  min-height: 140px;
}
.uc-card.is-dark .uc-visual { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.08); color: rgba(255,255,255,0.85); }

/* ───── Meet your agents ───── */
.agents-sec { background: var(--bg); }
.agents-head { text-align: center; max-width: 640px; margin: 0 auto 64px; }
.pillars { display: flex; flex-direction: column; gap: 56px; }
.pillar { }
.pillar-head {
  display: flex;
  align-items: center;
  gap: 16px;
  padding-bottom: 20px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--line);
}
.pillar-ic {
  width: 44px; height: 44px;
  flex: none;
  border-radius: 12px;
  background: var(--accent-soft);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
}
.pillar-title {
  font-size: clamp(22px, 2.2vw, 28px);
  font-weight: 600;
  letter-spacing: -0.018em;
  color: var(--ink);
  margin: 0;
  line-height: 1.1;
}
.pillar-sub {
  font-size: 14.5px;
  color: var(--ink-3);
  margin: 4px 0 0;
}
.pillar-metric { margin-left: auto; flex: none; text-align: right; line-height: 1; }
.pillar-metric-val {
  display: block;
  font-size: clamp(20px, 2vw, 27px);
  font-weight: 650;
  letter-spacing: -0.025em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.pillar-metric-lbl {
  display: block;
  margin-top: 6px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-4);
}
.agent-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
.agent-card {
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 12px 12px 14px;
  transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
}
.agent-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
  border-color: var(--line-strong);
}
.agent-viz {
  height: 192px;
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  border: 1px solid var(--line);
  perspective: 900px;
  perspective-origin: 50% 36%;
  background:
    radial-gradient(120% 92% at 88% 120%, var(--accent-soft) 0%, rgba(255,255,255,0) 50%),
    radial-gradient(90% 80% at 4% -20%, rgba(124,58,237,0.10) 0%, rgba(255,255,255,0) 46%),
    linear-gradient(168deg, var(--bg) 0%, var(--bg-elevated) 100%);
  margin-bottom: 12px;
}
.agent-viz::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(currentColor 1px, transparent 1.4px);
  background-size: 15px 15px;
  color: var(--ink);
  opacity: 0.04;
  pointer-events: none;
  z-index: 0;
}
.agent-viz::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), inset 0 -52px 64px -46px rgba(16,24,40,0.17);
  pointer-events: none;
  z-index: 9;
}
.av-root {
  position: absolute; inset: 0; z-index: 1;
  transform-style: preserve-3d;
  transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition: transform 0.55s cubic-bezier(.2,.7,.2,1);
}
.av-root.tilting { transition: transform 0.1s ease-out; }
.av-glow {
  position: absolute; right: -20px; bottom: -28px;
  width: 132px; height: 132px; border-radius: 50%;
  background: radial-gradient(circle, var(--accent) 0%, rgba(255,255,255,0) 68%);
  opacity: 0.16; filter: blur(18px); pointer-events: none;
  transform: translateZ(-55px);
  animation: avGlow 6s ease-in-out infinite;
}
.av-glow.v {
  right: auto; left: -30px; top: -34px; width: 156px; height: 156px;
  background: radial-gradient(circle, #7c3aed 0%, rgba(255,255,255,0) 70%);
  opacity: 0.12; filter: blur(22px); transform: translateZ(-72px); animation: none;
}
.av-spot {
  position: absolute; inset: 18px; border-radius: 12px; z-index: 7;
  pointer-events: none; opacity: 0; transition: opacity 0.3s ease;
  background: radial-gradient(150px 150px at var(--sx, 50%) var(--sy, 24%), rgba(255,255,255,0.34), rgba(255,255,255,0) 62%);
  mix-blend-mode: soft-light; transform: translateZ(1px);
}
.agent-card:hover .av-spot { opacity: 1; }

/* ── Agent visual kit (mini product-UI fragments) ── */
.av-card {
  position: absolute;
  inset: 18px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.6),
    0 22px 42px -18px rgba(16,24,40,0.34),
    0 4px 10px -3px rgba(16,24,40,0.12);
  padding: 12px 13px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.av-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.av-label {
  font-size: 9px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--ink-4); line-height: 1; white-space: nowrap;
}
.av-num {
  font-size: 21px; font-weight: 650; letter-spacing: -0.03em; line-height: 1;
  color: var(--ink); font-variant-numeric: tabular-nums;
}
.av-sub { font-size: 10px; color: var(--ink-3); line-height: 1; letter-spacing: -0.01em; }
.av-pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 600; letter-spacing: -0.01em; line-height: 1;
  padding: 3px 7px; border-radius: 999px;
  background: var(--bg-elevated); color: var(--ink-2); border: 1px solid var(--line);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.av-pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.av-pill.good  { background: rgba(34,197,94,0.13); color: #16a34a; border-color: transparent; }
.av-pill.warn  { background: rgba(245,158,11,0.15); color: #b45309; border-color: transparent; }
.av-spark { display: block; width: 100%; height: 100%; }
.av-thumb {
  border-radius: 6px;
  background: linear-gradient(150deg, var(--accent-soft), var(--bg-elevated));
  border: 1px solid var(--line); flex: none;
}
.av-bar-track { background: var(--bg-elevated); border-radius: 999px; overflow: hidden; flex: 1; }
.av-bar-fill { height: 100%; border-radius: 999px; background: var(--accent); }
.av-bar-fill.good { background: #22c55e; }
.av-bar-fill.mut { background: var(--ink-4); opacity: 0.5; }
.av-line { height: 4px; border-radius: 999px; background: var(--ink); opacity: 0.13; }
.av-chip {
  font-size: 9.5px; font-weight: 600; color: var(--ink-2); line-height: 1;
  padding: 3px 6px; border-radius: 6px; background: var(--bg-elevated);
  border: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.av-chip.on { background: var(--accent); color: #fff; border-color: transparent; }
.av-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

/* depth + realism */
.av-tip {
  position: absolute; z-index: 4;
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 650; letter-spacing: -0.01em; line-height: 1;
  color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px;
  box-shadow: 0 10px 20px -8px rgba(16,24,40,0.34);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.av-tip.accent { border-color: transparent; box-shadow: 0 0 0 1px var(--accent) inset, 0 8px 22px -6px var(--accent-soft), 0 10px 20px -10px rgba(16,24,40,0.3); color: var(--accent); }
.av-cursor { position: absolute; z-index: 6; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.28)); }
.av-marker {
  position: absolute; width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 3px var(--bg), 0 0 12px 2px var(--accent);
  transform: translate(-50%, -50%); z-index: 3;
}
.av-marker::after {
  content: ""; position: absolute; inset: -3px; border-radius: 50%;
  border: 1.5px solid var(--accent);
  animation: avPing 2.4s cubic-bezier(.2,.7,.2,1) infinite;
}
@keyframes avPing {
  0% { transform: scale(1); opacity: 0.75; }
  70%, 100% { transform: scale(2.6); opacity: 0; }
}
.av-donut {
  position: relative; flex: none; border-radius: 50%;
  background: conic-gradient(var(--accent) calc(var(--p, 60) * 1%), var(--bg-elevated) 0);
  -webkit-mask: radial-gradient(farthest-side, #0000 60%, #000 61%);
          mask: radial-gradient(farthest-side, #0000 60%, #000 61%);
}
.av-brand { width: 15px; height: 15px; border-radius: 5px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
.av-brand.meta   { background: #0866ff; }
.av-brand.google { background: conic-gradient(#ea4335, #fbbc05, #34a853, #4285f4, #ea4335); }
.av-brand.tiktok { background: #111; }

/* ── motion (entrance gated on .is-in; ambient kept subtle) ── */
.av-glow { animation: avGlow 5.5s ease-in-out infinite; }
.av-draw { stroke-dasharray: 1; stroke-dashoffset: 0; }
.av-rise, .av-pop, .av-grow, .av-wide { /* final state by default */ }
.av-grow { transform-origin: bottom; }
.av-wide { transform-origin: left; }
.av-root.is-in .av-draw { animation: avDraw 1.2s cubic-bezier(.4,0,.2,1) both; }
.av-root.is-in .av-area { animation: avFade 1s ease both; }
.av-root.is-in .av-rise { animation: avRise .7s cubic-bezier(.2,.7,.2,1) both; }
.av-root.is-in .av-pop  { animation: avPop .6s cubic-bezier(.2,1.4,.4,1) both; }
.av-root.is-in .av-grow { animation: avGrow .8s cubic-bezier(.2,.8,.2,1) both; }
.av-root.is-in .av-wide { animation: avWide .9s cubic-bezier(.2,.8,.2,1) both; }
.av-root.is-in .av-d1 { animation-delay: .08s; }
.av-root.is-in .av-d2 { animation-delay: .18s; }
.av-root.is-in .av-d3 { animation-delay: .28s; }
.av-root.is-in .av-d4 { animation-delay: .38s; }
.av-flow { stroke-dasharray: 5 7; animation: avDash 1.1s linear infinite; }
.av-pulse { transform-origin: center; animation: avPulse 2.6s ease-in-out infinite; }
@keyframes avPulse { 0%,100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 0; transform: scale(1.9); } }
.av-shimmer {
  background: linear-gradient(100deg, var(--bg-elevated) 30%, var(--accent-soft) 50%, var(--bg-elevated) 70%);
  background-size: 240% 100%;
  animation: avShimmer 1.6s linear infinite;
}
@keyframes avDraw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes avFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes avRise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
@keyframes avPop  { from { opacity: 0; transform: scale(.78); } to { opacity: 1; transform: scale(1); } }
@keyframes avGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes avWide { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes avGlow { 0%,100% { opacity: .12; } 50% { opacity: .26; } }
@keyframes avDash { to { stroke-dashoffset: -24; } }
@keyframes avShimmer { 0% { background-position: 120% 0; } 100% { background-position: -120% 0; } }
@media (prefers-reduced-motion: reduce) {
  .agent-viz *, .av-glow { animation: none !important; }
  .av-draw { stroke-dashoffset: 0 !important; }
}
.agent-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 2px;
}
.agent-name {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin: 0;
}
.agent-impact {
  flex: none;
  font-size: 11.5px;
  font-weight: 650;
  letter-spacing: -0.01em;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 7px;
  padding: 4px 8px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* card with an embedded video demo */
.agent-card.has-video { cursor: pointer; }
.agent-card.has-video .agent-viz { position: relative; }
/* inline muted preview that plays on hover */
.agent-inline-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: inherit;
  z-index: 7;
  opacity: 0;
  transition: opacity 0.35s ease;
  pointer-events: none;
}
.agent-card.has-video:hover .agent-inline-video { opacity: 1; }
/* "tap for sound" hint, appears on hover/focus */
.agent-hint {
  position: absolute;
  left: 9px; bottom: 9px;
  z-index: 8;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 0;
  cursor: pointer;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: -0.01em;
  color: #fff;
  background: rgba(0,0,0,0.52);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  border-radius: 999px;
  padding: 5px 10px;
  opacity: 0;
  transform: translateY(5px);
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.agent-card.has-video:hover .agent-hint,
.agent-hint:focus-visible { opacity: 1; transform: none; }
/* persistent "has video" affordance even before hover */
.agent-video-badge {
  position: absolute;
  top: 9px; right: 9px;
  z-index: 6;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--bg);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  padding-left: 1px;
  box-shadow: 0 3px 10px -2px rgba(0,0,0,0.3), inset 0 0 0 1px var(--line);
  transition: opacity 0.2s ease;
  pointer-events: none;
}
.agent-card.has-video:hover .agent-video-badge { opacity: 0; }

/* ── P&L pillar legend ── */
.pnl-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 20px;
  margin-bottom: 20px;
}
.pnl-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--ink-2);
}
.pnl-legend-dot {
  width: 11px; height: 11px;
  border-radius: 3px;
  flex: none;
}
.pnl-legend-dot.is-rev  { background: #0066cc; }
.pnl-legend-dot.is-cogs { background: #16863e; }
.pnl-legend-dot.is-mkt  { background: #6d28d9; }
.pnl-legend-dot.is-ops  { background: #c2410c; }
[data-theme="dark"] .pnl-legend-dot.is-rev  { background: #6cb9ff; }
[data-theme="dark"] .pnl-legend-dot.is-cogs { background: #7ce198; }
[data-theme="dark"] .pnl-legend-dot.is-mkt  { background: #c4b5fd; }
[data-theme="dark"] .pnl-legend-dot.is-ops  { background: #fdba74; }

/* ── Video lightbox ── */
.vid-scrim {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(10,12,18,0.72);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 5vh 24px;
  animation: vidIn 0.2s ease;
}
@keyframes vidIn { from { opacity: 0; } to { opacity: 1; } }
.vid-modal {
  width: min(960px, 100%);
  border-radius: 16px;
  overflow: hidden;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  box-shadow: 0 40px 90px -20px rgba(0,0,0,0.6);
  animation: vidPop 0.26s cubic-bezier(.2,.8,.3,1);
}
@keyframes vidPop { from { transform: translateY(12px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }
.vid-modal .demo-titlebar { position: relative; }
.vid-close {
  position: absolute;
  right: 12px; top: 50%;
  transform: translateY(-50%);
  width: 26px; height: 26px;
  border: 0;
  border-radius: 50%;
  background: var(--bg-elevated);
  color: var(--ink-2);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.vid-close:hover { background: var(--line-strong); color: var(--ink); }
.vid-body {
  position: relative;
  aspect-ratio: 16 / 9;
  background: #000;
}
.vid-el {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
@media (max-width: 860px) {
  .agent-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 560px) {
  .agent-grid { grid-template-columns: 1fr; }
}

/* ───── Real agent video ───── */
.video-sec { background: linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%); padding-top: 64px; }
.video-head { text-align: center; max-width: 640px; margin: 0 auto; }
.video-head .lede { margin: 18px auto 0; }
.video-window {
  margin: 56px auto 0;
  max-width: 1040px;
  border-radius: 18px;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.video-body {
  position: relative;
  aspect-ratio: 16 / 9;
  background: #000;
}
.video-el {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  cursor: pointer;
}
.video-overlay {
  position: absolute;
  inset: 0;
  border: 0;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  background:
    radial-gradient(70% 70% at 50% 50%, rgba(0,0,0,0.10), rgba(0,0,0,0.55) 100%),
    linear-gradient(180deg, rgba(0,102,204,0.18), rgba(120,80,255,0.12));
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
  transition: opacity 200ms ease;
}
.video-overlay:hover { opacity: 0.94; }
.video-play {
  width: 78px;
  height: 78px;
  border-radius: 50%;
  background: rgba(255,255,255,0.92);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  padding-left: 4px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  transition: transform 160ms ease;
}
.video-overlay:hover .video-play { transform: scale(1.06); }
.video-cap {
  color: #fff;
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: 0.01em;
  text-shadow: 0 1px 8px rgba(0,0,0,0.4);
}

/* ───── Demo ───── */
.demo-window {
  margin-top: 64px;
  border-radius: 18px;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.demo-titlebar {
  height: 36px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--line);
}
.tl-dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(0,0,0,0.12); }
.tl-dot.r { background: #ff5f57; }
.tl-dot.y { background: #febc2e; }
.tl-dot.g { background: #28c840; }
.demo-title {
  flex: 1;
  text-align: center;
  font-size: 12px;
  color: var(--ink-3);
  font-weight: 500;
  letter-spacing: -0.005em;
}
.demo-body {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 580px;
}
.demo-side {
  background: var(--bg-soft);
  border-right: 1px solid var(--line);
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.demo-side-label {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-4);
  padding: 12px 10px 6px;
}
.demo-side-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13.5px;
  color: var(--ink-2);
  border: 0;
  background: transparent;
  text-align: left;
  width: 100%;
}
.demo-side-item:hover { background: rgba(0,0,0,0.04); }
.demo-side-item.is-active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
[data-theme="dark"] .demo-side-item:hover { background: rgba(255,255,255,0.06); }
.demo-side-icon {
  width: 18px; height: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  color: currentColor;
}
.demo-main {
  padding: 28px 32px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  background: var(--bg);
}

/* ───── Integrations ───── */
.intg-strip {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 12px;
  margin-top: 48px;
}
.intg-tile {
  aspect-ratio: 1.4;
  border-radius: var(--radius-md);
  background: var(--bg-soft);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  letter-spacing: -0.005em;
  transition: transform 200ms ease;
}
.intg-tile:hover { transform: translateY(-2px); }

/* ───── Logos ───── */
.logos {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin-top: 32px;
  align-items: center;
}
.logo-item {
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-3);
  font-weight: 600;
  font-size: 17px;
  letter-spacing: -0.01em;
  opacity: 0.78;
}

/* ───── Pricing ───── */
.pricing-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 64px;
}
.price-card {
  border-radius: var(--radius-xl);
  padding: 36px 32px;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.price-card.is-featured {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.price-card.is-featured .kicker,
.price-card.is-featured .price-feat li { color: rgba(255,255,255,0.7); }
.price-card.is-featured .btn-ghost { color: var(--bg); border-color: rgba(255,255,255,0.25); }
.price-card.is-featured .btn-ghost:hover { background: rgba(255,255,255,0.08); }
.price-num {
  font-size: 56px;
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1;
}
.price-feat {
  list-style: none;
  margin: 0;
  padding: 16px 0 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-top: 1px solid var(--line);
  font-size: 14px;
  color: var(--ink-2);
}
.price-card.is-featured .price-feat { border-top-color: rgba(255,255,255,0.14); }

/* ───── Footer CTA ───── */
.cta-final {
  padding: 160px 32px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.cta-final-bg {
  position: absolute; inset: 0; z-index: 0;
  background:
    radial-gradient(60% 60% at 50% 40%, rgba(0,102,204,0.18), transparent 70%),
    radial-gradient(40% 40% at 30% 70%, rgba(170,90,255,0.16), transparent 70%),
    radial-gradient(40% 40% at 70% 70%, rgba(40,180,200,0.16), transparent 70%);
  filter: blur(30px);
}
.cta-final-inner { position: relative; z-index: 1; }

footer.foot {
  border-top: 1px solid var(--line);
  padding: 48px 0 64px;
  font-size: 12px;
  color: var(--ink-3);
}
.foot-row {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
  gap: 32px;
}
.foot-col h5 {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  margin: 0 0 14px;
  letter-spacing: -0.005em;
}
.foot-col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.foot-col a { color: var(--ink-3); font-size: 12.5px; }
.foot-col a:hover { color: var(--ink); text-decoration: none; }
.foot-bottom {
  margin-top: 48px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
}

/* ───── Talk to us modal ───── */
.modal-scrim {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0,0,0,0.55);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  animation: scrimIn 220ms ease;
}
@keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
.modal-card {
  width: 100%;
  max-width: 480px;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: 22px;
  padding: 36px 36px 32px;
  box-shadow: var(--shadow-lg);
  position: relative;
  animation: modalIn 280ms cubic-bezier(.2,.8,.2,1) both;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(12px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 0;
  background: var(--bg-elevated);
  color: var(--ink-2);
  font-size: 17px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-close:hover { background: var(--line); color: var(--ink); }
.modal-eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 12px;
}
.modal-title {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin: 0 0 8px;
}
.modal-sub {
  color: var(--ink-3);
  font-size: 15px;
  line-height: 1.5;
  margin: 0 0 24px;
}
.modal-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.modal-input {
  width: 100%;
  height: 48px;
  padding: 0 18px;
  background: var(--bg-soft);
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  outline: 0;
  letter-spacing: -0.005em;
  transition: border-color 160ms ease, box-shadow 160ms ease;
}
.modal-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.modal-input::placeholder { color: var(--ink-4); }
.modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-form .btn-primary { height: 48px; padding: 0; justify-content: center; margin-top: 4px; }
.modal-msg {
  font-size: 13px;
  color: var(--ink-3);
  margin-top: 8px;
  text-align: center;
  min-height: 18px;
}
.modal-msg.is-ok { color: #16a34a; }
.modal-msg.is-err { color: #dc2626; }
@media (max-width: 560px) {
  .modal-card { padding: 28px 24px 24px; border-radius: 18px; }
  .modal-row { grid-template-columns: 1fr; }
}

/* ───── Visuals: tiny chart ───── */
.spark { width: 100%; height: 80px; }
.spark path.line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark path.area { fill: var(--accent-soft); }
.spark .pred { stroke-dasharray: 4 4; opacity: 0.7; }

/* ───── Stats row ───── */
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 80px; }
.stat-row .stat { padding: 28px 0; border-top: 1px solid var(--line); }
.stat-num { font-size: 56px; font-weight: 600; letter-spacing: -0.025em; line-height: 1; }
.stat-lbl { color: var(--ink-3); margin-top: 10px; font-size: 14px; }

/* ───── Hero stats band (PE/CEO proof strip) ───── */
.hero-stats {
  margin: 56px auto 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  max-width: 980px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--bg);
}
.hero-stat {
  padding: 24px 20px;
  text-align: left;
  border-right: 1px solid var(--line);
}
.hero-stat:last-child { border-right: 0; }
.hero-stat-num {
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1;
  color: var(--ink);
}
.hero-stat-lbl {
  font-size: 12.5px;
  color: var(--ink-3);
  margin-top: 8px;
  line-height: 1.35;
  letter-spacing: -0.005em;
}

/* ───── P&L table ───── */
.pnl-head { margin-bottom: 56px; }
.pnl-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 32px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink-2);
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
.pnl-pill.is-on {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: rgba(0,102,204,0.25);
}
.pnl-table {
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  background: var(--bg);
  overflow: hidden;
  box-shadow: var(--shadow-md);
}
.pnl-row {
  display: grid;
  grid-template-columns: 1.4fr 0.9fr 0.9fr 0.7fr 2.1fr;
  align-items: center;
  padding: 16px 28px;
  border-bottom: 1px solid var(--line);
  font-size: 14.5px;
}
.pnl-row:last-child { border-bottom: 0; }
.pnl-row.pnl-header {
  background: var(--bg-soft);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: 14px 28px;
}
.pnl-row.is-subtotal {
  font-weight: 600;
  background: var(--bg-soft);
}
.pnl-row.is-highlight {
  background: linear-gradient(90deg, rgba(0,102,204,0.06), rgba(120,80,255,0.04));
  font-weight: 600;
}
.pnl-row.is-pct {
  font-size: 12.5px;
  color: var(--ink-3);
  padding: 10px 28px;
}
.pnl-row.is-pct.is-highlight {
  color: var(--accent);
  background: var(--accent-soft);
  font-weight: 600;
}
.pnl-cell.line { color: var(--ink); }
.pnl-row.is-pct .pnl-cell.line { color: inherit; }
.pnl-cell.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
}
.pnl-cell.num.strong { color: var(--ink); font-weight: 600; }
.pnl-cell.num.delta.is-up { color: #16a34a; }
.pnl-cell.num.delta.is-down { color: #16a34a; }
.pnl-cell.agents {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding-left: 28px;
}
.pnl-agent {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
.pnl-agent.is-accent {
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid rgba(0,102,204,0.18);
}
.pnl-agent.is-warn {
  background: rgba(232,166,99,0.12);
  color: #c87a3a;
  border: 1px solid rgba(200,122,58,0.22);
}
/* Per-line P&L tones */
.pnl-agent.is-rev {
  background: rgba(0,102,204,0.10);
  color: #0066cc;
  border: 1px solid rgba(0,102,204,0.22);
}
.pnl-agent.is-cogs {
  background: rgba(22,163,74,0.10);
  color: #16863e;
  border: 1px solid rgba(22,163,74,0.22);
}
.pnl-agent.is-mkt {
  background: rgba(124,58,237,0.10);
  color: #6d28d9;
  border: 1px solid rgba(124,58,237,0.22);
}
.pnl-agent.is-ops {
  background: rgba(232,118,99,0.12);
  color: #c2410c;
  border: 1px solid rgba(232,118,99,0.24);
}
[data-theme="dark"] .pnl-agent.is-rev {
  background: rgba(41,151,255,0.16); color: #6cb9ff; border-color: rgba(41,151,255,0.28);
}
[data-theme="dark"] .pnl-agent.is-cogs {
  background: rgba(34,197,94,0.14); color: #7ce198; border-color: rgba(34,197,94,0.28);
}
[data-theme="dark"] .pnl-agent.is-mkt {
  background: rgba(167,139,250,0.14); color: #c4b5fd; border-color: rgba(167,139,250,0.28);
}
[data-theme="dark"] .pnl-agent.is-ops {
  background: rgba(251,146,60,0.14); color: #fdba74; border-color: rgba(251,146,60,0.28);
}
.pnl-foot {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  margin-top: 32px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.pnl-foot-stat {
  background: var(--bg);
  padding: 28px 24px;
}
.pnl-foot-num {
  font-size: 36px;
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1;
  color: var(--ink);
}
.pnl-foot-lbl {
  font-size: 13px;
  color: var(--ink-3);
  margin-top: 10px;
  letter-spacing: -0.005em;
}

/* ───── Function-grouped use cases ───── */
.uc-group {
  margin-top: 64px;
}
.uc-group + .uc-group { margin-top: 40px; }
.uc-group-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 24px;
  padding-bottom: 20px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--line);
}
.uc-group-num {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--ink-4);
  font-variant-numeric: tabular-nums;
}
.uc-group-title {
  font-size: clamp(24px, 2.4vw, 32px);
  font-weight: 600;
  letter-spacing: -0.018em;
  margin: 4px 0 0;
  line-height: 1.15;
}
.uc-group-blurb {
  color: var(--ink-3);
  font-size: 15px;
  max-width: 42ch;
  text-align: right;
  margin: 0;
  line-height: 1.45;
}

@media (max-width: 960px) {
  .hero-stats { grid-template-columns: 1fr 1fr; }
  .hero-stat { border-bottom: 1px solid var(--line); }
  .hero-stat:nth-child(2) { border-right: 0; }
  .pnl-row, .pnl-row.pnl-header {
    grid-template-columns: 1.4fr 1fr 1fr;
    padding: 14px 18px;
  }
  .pnl-cell.delta, .pnl-cell.agents { display: none; }
  .pnl-foot { grid-template-columns: 1fr 1fr; }
  .uc-group-head { flex-direction: column; align-items: flex-start; }
  .uc-group-blurb { text-align: left; }
}

/* ───── Verticals ("Commerce, end to end") ───── */
.verts {
  background: linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 100%);
  border-top: 1px solid var(--line);
}
.verts-head {
  display: grid;
  grid-template-columns: 160px 1fr 1fr;
  gap: 48px;
  align-items: flex-start;
  padding-bottom: 64px;
  border-bottom: 1px solid var(--line);
}
.verts-eyebrow,
.caps-eyebrow {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.12em;
  color: var(--accent);
  padding-top: 14px;
}
.verts-title,
.caps-title { margin: 0; }
.verts-title-em,
.caps-title-em {
  font-weight: 400;
  font-style: italic;
  color: var(--accent);
  letter-spacing: -0.025em;
}
.verts-blurb,
.caps-blurb {
  color: var(--ink-3);
  margin: 0;
  font-size: 15px;
  line-height: 1.55;
  max-width: 38ch;
  padding-top: 12px;
}
.verts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0;
  margin-top: 0;
}
.vert-card {
  position: relative;
  padding: 56px 40px 48px;
  border-right: 1px solid var(--line);
}
.vert-card:last-child { border-right: 0; }
.vert-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--accent-soft);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 28px;
}
.vert-n {
  position: absolute;
  top: 56px;
  right: 40px;
  font-size: 84px;
  font-weight: 200;
  letter-spacing: -0.04em;
  color: var(--ink);
  opacity: 0.06;
  font-feature-settings: "lnum";
  line-height: 1;
}
.vert-title {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.018em;
  margin: 0 0 14px;
  line-height: 1.15;
}
.vert-blurb {
  color: var(--ink-3);
  font-size: 15px;
  line-height: 1.55;
  margin: 0 0 24px;
  max-width: 38ch;
}
.vert-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.vert-tag {
  display: inline-flex;
  align-items: center;
  height: 26px;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--ink-2);
}

/* ───── Capabilities ("Every functional layer") ───── */
.caps {
  background: var(--bg);
  border-top: 1px solid var(--line);
}
.caps-head {
  display: grid;
  grid-template-columns: 160px 1fr 1fr;
  gap: 48px;
  align-items: flex-start;
  padding-bottom: 56px;
  border-bottom: 1px solid var(--line);
}
.caps-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0;
}
.cap-card {
  padding: 44px 40px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.cap-card:nth-child(3n) { border-right: 0; }
.cap-card:nth-child(n+4) { border-bottom: 0; }
.cap-n {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.12em;
  margin-bottom: 28px;
}
.cap-n.is-accent { color: var(--accent); }
.cap-n.is-warn { color: #c87a3a; }
.cap-title {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.018em;
  margin: 0 0 12px;
}
.cap-blurb {
  color: var(--ink-3);
  font-size: 15px;
  line-height: 1.55;
  margin: 0;
  max-width: 38ch;
}

/* ───── Use case filter (radio segmented) ───── */
.uc-filter {
  display: inline-flex;
  margin-top: 28px;
  padding: 4px;
  background: var(--bg-elevated);
  border-radius: 999px;
  border: 1px solid var(--line);
}
.uc-filter-btn {
  height: 36px;
  padding: 0 18px;
  border: 0;
  background: transparent;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--ink-3);
  transition: color 120ms ease, background 120ms ease;
}
.uc-filter-btn[aria-selected="true"] {
  background: var(--bg);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}

@media (max-width: 960px) {
  .verts-head, .caps-head { grid-template-columns: 1fr; gap: 20px; }
  .verts-grid, .caps-grid { grid-template-columns: 1fr; }
  .vert-card, .cap-card { border-right: 0; border-bottom: 1px solid var(--line); padding: 36px 0; }
  .vert-card:last-child, .cap-card:last-child { border-bottom: 0; }
  .cap-card:nth-child(n+4) { border-bottom: 1px solid var(--line); }
  .vert-n { font-size: 64px; }
}

/* ───── Apple-style alternating feature blocks ───── */
.feat {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
  padding: 100px 0;
}
.feat.is-reverse { direction: rtl; }
.feat.is-reverse > * { direction: ltr; }
.feat-copy h3 { font-size: clamp(36px, 4vw, 56px); font-weight: 600; letter-spacing: -0.024em; line-height: 1.08; margin: 0 0 18px; }
.feat-copy p { color: var(--ink-2); font-size: 19px; line-height: 1.45; margin: 0 0 20px; max-width: 48ch; }
.feat-visual {
  border-radius: var(--radius-xl);
  background: var(--bg-soft);
  border: 1px solid var(--line);
  padding: 28px;
  min-height: 420px;
  position: relative;
  overflow: hidden;
}

/* small text */
.muted { color: var(--ink-3); }
.mono { font-family: var(--font-mono); font-size: 12px; }

/* divider */
.divider { height: 1px; background: var(--line); margin: 0; border: 0; }

/* Tabs reveal animation */
.tab-fade { animation: fadeIn 280ms ease both; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* responsive */
@media (max-width: 960px) {
  .mode-stage { grid-template-columns: 1fr; }
  .uc-grid { grid-template-columns: repeat(6, 1fr); }
  .uc-card.col-6, .uc-card.col-4, .uc-card.col-8 { grid-column: span 6; }
  .demo-body { grid-template-columns: 1fr; }
  .demo-side { border-right: 0; border-bottom: 1px solid var(--line); }
  .feat { grid-template-columns: 1fr; gap: 32px; padding: 60px 0; }
  .pricing-grid { grid-template-columns: 1fr; }
  .foot-row { grid-template-columns: 1fr 1fr; }
  .intg-strip { grid-template-columns: repeat(4, 1fr); }
  .logos { grid-template-columns: repeat(3, 1fr); }
  .stat-row { grid-template-columns: 1fr; }
}

</style>

    font:inherit;font-variant-numeric:tabular-nums;text-align:right;padding:0 8px 0 0;
    outline:none;color:inherit;-moz-appearance:textfield}
  .twk-num input::-webkit-inner-spin-button,.twk-num input::-webkit-outer-spin-button{
    -webkit-appearance:none;margin:0}

  .twk-btn{appearance:none;height:26px;padding:0 12px;border:0;border-radius:7px;
    background:rgba(0,0,0,.78);color:#fff;font:inherit;font-weight:500;cursor:default}
  .twk-btn:hover{background:rgba(0,0,0,.88)}
  .twk-btn.secondary{background:rgba(0,0,0,.06);color:inherit}
  .twk-btn.secondary:hover{background:rgba(0,0,0,.1)}

  .twk-swatch{appearance:none;-webkit-appearance:none;width:56px;height:22px;
    border:.5px solid rgba(0,0,0,.1);border-radius:6px;padding:0;cursor:default;
    background:transparent;flex-shrink:0}
  .twk-swatch::-webkit-color-swatch-wrapper{padding:0}

  .twk-swatch::-moz-color-swatch{border:0;border-radius:5.5px}
`;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<script type="text/babel" data-src="visuals.jsx">
// visuals.jsx — small sub-visuals used in cards and panels

function Sparkline({ data, width = 320, height = 80, predFrom = 0.6 }) {
  const max = Math.max(...data);
  const min = Math.min(...data);
  const r = max - min || 1;
  const stepX = width / (data.length - 1);
  const pts = data.map((v, i) => [i * stepX, height - ((v - min) / r) * (height - 12) - 6]);
  const cut = Math.floor(data.length * predFrom);
  const past = pts.slice(0, cut + 1);
  const fut = pts.slice(cut);
  const toPath = (arr) => arr.map((p, i) => `${i === 0 ? "M" : "L"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
  const areaPath = `${toPath(past)} L${past[past.length - 1][0]} ${height} L0 ${height} Z`;
  return (
    <svg className="spark" viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none">
      <path className="area" d={areaPath} />
      <path className="line" d={toPath(past)} />
      <path className="line pred" d={toPath(fut)} />
    </svg>
  );
}

function MiniBars({ values, accent = false }) {
  const max = Math.max(...values);
  return (
    <div style={{display:"flex",alignItems:"flex-end",gap:6,height:80,width:"100%"}}>
      {values.map((v,i)=>(
        <div key={i} style={{
          flex:1,
          height: `${(v/max)*100}%`,
          background: accent ? "var(--accent)" : "var(--ink-2)",
          opacity: accent ? (0.45 + (i/values.length)*0.55) : 0.18 + (v/max)*0.5,
          borderRadius: 3,
          transition:"height 280ms ease"
        }}/>
      ))}
    </div>
  );
}

function StatLine({ label, value, delta }) {
  return (
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",padding:"10px 0",borderBottom:"1px solid var(--line)"}}>
      <span style={{color:"var(--ink-3)",fontSize:13}}>{label}</span>
      <span style={{display:"flex",gap:10,alignItems:"baseline"}}>
        <span style={{fontWeight:600,fontSize:15,letterSpacing:"-0.01em"}}>{value}</span>
        {delta && <span style={{fontSize:12,color: delta.startsWith("+") ? "#16a34a" : "#dc2626"}}>{delta}</span>}
      </span>
    </div>
  );
}

function AgentRow({ name, status, time, icon }) {
  const map = {
    running: {bg:"rgba(0,102,204,0.10)", c:"var(--accent)", label:"Running"},
    queued:  {bg:"rgba(0,0,0,0.06)", c:"var(--ink-3)", label:"Queued"},
    done:    {bg:"rgba(22,163,74,0.10)", c:"#16a34a", label:"Completed"},
  };
  const s = map[status] || map.done;
  return (
    <div style={{display:"flex",alignItems:"center",gap:14,padding:"14px 16px",borderRadius:12,background:"var(--bg)",border:"1px solid var(--line)"}}>
      <div style={{width:32,height:32,borderRadius:8,background:"var(--bg-elevated)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--ink-2)"}}>{icon}</div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:500,fontSize:14,letterSpacing:"-0.005em"}}>{name}</div>
        <div style={{color:"var(--ink-3)",fontSize:12,marginTop:2}}>{time}</div>
      </div>
      <span style={{fontSize:11,fontWeight:500,padding:"4px 10px",borderRadius:999,background:s.bg,color:s.c}}>{s.label}</span>
    </div>
  );
}

function Pill({ children, tone = "neutral" }) {
  const tones = {
    neutral: { bg: "var(--bg-elevated)", c: "var(--ink-2)" },
    accent:  { bg: "var(--accent-soft)", c: "var(--accent)" },
    warn:    { bg: "rgba(232,166,99,0.14)", c: "#c87a3a" },
    good:    { bg: "rgba(22,163,74,0.10)", c: "#16a34a" },
  }[tone];
  return <span style={{display:"inline-flex",alignItems:"center",gap:5,padding:"3px 9px",borderRadius:999,fontSize:11,fontWeight:500,background:tones.bg,color:tones.c}}>{children}</span>;
}

Object.assign(window, { Sparkline, MiniBars, StatLine, AgentRow, Pill });

</script>

// through dark mode + the accent tweak. Respects prefers-reduced-motion.

const { useRef: useRefAV, useState: useStateAV, useEffect: useEffectAV } = React;
const ACC = "var(--accent)";
const GOOD = "#22c55e";
const VizCtx = React.createContext(false);
const useSeen = () => React.useContext(VizCtx);

function useInView() {
  const ref = useRefAV(null);
  const [seen, setSeen] = useStateAV(false);
  useEffectAV(() => {
    const el = ref.current;
    if (!el || seen) return;
    if (!("IntersectionObserver" in window)) { setSeen(true); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } });
    }, { threshold: 0.3 });
    io.observe(el);
    return () => io.disconnect();
  }, [seen]);
  return [ref, seen];
}

const REDUCED = typeof window !== "undefined" &&
  window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// count a number up when `run` flips true
function useCount(target, run, dur = 1000) {
  const [v, setV] = useStateAV(REDUCED ? target : 0);
  useEffectAV(() => {
    if (!run || REDUCED) { setV(target); return; }
    let raf, t0;
    const tick = (t) => {
      if (!t0) t0 = t;
      const p = Math.min(1, (t - t0) / dur);
      setV(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [run, target]);
  return v;
}

function Count({ run, value, fmt }) {
  const v = useCount(value, run);
  return <React.Fragment>{fmt(v)}</React.Fragment>;
}

// Catmull-Rom → cubic bezier for buttery chart curves
function smooth(pts) {
  if (pts.length < 2) return "";
  const d = [`M${pts[0].x},${pts[0].y}`];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d.push(`C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x},${p2.y}`);
  }
  return d.join(" ");
}

function AreaChart({ gid, pts, cut }) {
  const H = 64;
  const solid = cut != null ? pts.slice(0, cut + 1) : pts;
  const tail = cut != null ? pts.slice(cut) : null;
  const solidLine = smooth(solid);
  const areaD = `${smooth(pts)} L${pts[pts.length - 1].x},${H} L${pts[0].x},${H} Z`;
  return (
    <svg className="av-spark" viewBox={`0 0 300 ${H}`} preserveAspectRatio="none">
      <defs>
        <linearGradient id={gid} x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stopColor={ACC} stopOpacity="0.36"/>
          <stop offset="0.7" stopColor={ACC} stopOpacity="0.06"/>
          <stop offset="1" stopColor={ACC} stopOpacity="0"/>

      {[16, 32, 48].map((y) => (
        <line key={y} x1="0" y1={y} x2="300" y2={y} stroke="var(--ink)" strokeOpacity="0.06"
          strokeWidth="1" vectorEffect="non-scaling-stroke"/>
      ))}
      <path className="av-area" d={areaD} fill={`url(#${gid})`}/>
      <path className="av-draw" d={solidLine} pathLength="1" fill="none" stroke={ACC}
        strokeWidth="2.5" vectorEffect="non-scaling-stroke" strokeLinecap="round" strokeLinejoin="round"/>
      {tail && (
        <path d={smooth(tail)} pathLength="1" fill="none" stroke={ACC} strokeWidth="2.5"
          strokeDasharray="0.018 0.03" strokeOpacity="0.7" vectorEffect="non-scaling-stroke"
          strokeLinecap="round" strokeLinejoin="round"/>
      )}
    </svg>
  );
}

  creative: VCreative, returns: VReturns, cx: VCx, close: VClose,
};

function AgentViz({ kind, replayOnHover = true }) {
  const C = AGENT_VIZ[kind];
  const [ref, seen] = useInView();
  const rootRef = useRefAV(null);
  const [replay, setReplay] = useStateAV(0);

  const onEnter = () => {
    if (!REDUCED && replayOnHover) setReplay((k) => k + 1);
  };
  const onMove = (e) => {
    const root = rootRef.current;
    if (!root || REDUCED) return;
    const r = root.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    root.classList.add("tilting");
    root.style.setProperty("--ry", (px * 11).toFixed(2) + "deg");
    root.style.setProperty("--rx", (-py * 11).toFixed(2) + "deg");
    root.style.setProperty("--sx", ((e.clientX - r.left) / r.width * 100).toFixed(1) + "%");
    root.style.setProperty("--sy", ((e.clientY - r.top) / r.height * 100).toFixed(1) + "%");
  };
  const onLeave = () => {
    const root = rootRef.current;
    if (!root) return;
    root.classList.remove("tilting");
    root.style.setProperty("--ry", "0deg");
    root.style.setProperty("--rx", "0deg");
  };

  if (!C) return null;
  return (
    <VizCtx.Provider value={seen}>
      <div
        ref={(n) => { ref.current = n; rootRef.current = n; }}
        className={"av-root" + (seen ? " is-in" : "")}
        onMouseEnter={onEnter}
        onMouseMove={onMove}
        onMouseLeave={onLeave}
      >
        <span className="av-glow v"/>
        <span className="av-glow"/>
        <C key={replay}/>
        <span className="av-spot"/>
      </div>
    </VizCtx.Provider>
  );
}

function VideoModal() {
  const ref = useRefV(null);

<script type="text/babel" data-src="emailform.jsx">
// emailform.jsx — reusable email capture form
// Posts to one of three configurable endpoints:
//   - Google Apps Script Web App URL  (writes to a Google Sheet)
//   - Formspree / Getform / Basin     (any "form to email/db" service)
//   - Your own backend                (POST JSON {email, source})
// If no endpoint is configured, it falls back to localStorage (demo mode).
//
// Configure in Converts AI.html via window.CONVERTS_FORM_ENDPOINT.

const { useState: useStateE } = React;

async function submitEmail(email, source) {
  const endpoint = window.CONVERTS_FORM_ENDPOINT;
  const payload = { email, source, ts: new Date().toISOString() };

  // No endpoint configured: store locally (demo / preview)
  if (!endpoint || endpoint.startsWith("PASTE_")) {
    const key = "converts_waitlist";
    const prev = JSON.parse(localStorage.getItem(key) || "[]");
    prev.push(payload);
    localStorage.setItem(key, JSON.stringify(prev));
    console.log("[Converts AI] No endpoint set — saved locally.", payload);
    await new Promise(r => setTimeout(r, 500));
    return { ok: true, local: true };
  }

  // Google Apps Script + Formspree both accept POST with form-encoded data.
  // We use 'no-cors' for Apps Script so the browser doesn't choke on the
  // missing CORS header; we can't read the response but the row gets written.
  const body = new FormData();
  Object.entries(payload).forEach(([k,v]) => body.append(k, v));

  const isAppsScript = endpoint.includes("script.google.com");
  try {
    await fetch(endpoint, {
      method: "POST",
      body,
      mode: isAppsScript ? "no-cors" : "cors",
      headers: isAppsScript ? undefined : { Accept: "application/json" },
    });
  } catch (e) {
    // Submission still reaches the endpoint even if the response can't be read.
  }
  return { ok: true };
}

function EmailForm({ source = "hero", placeholder = "Enter your work email", cta = "Get early access", onLight = true }) {
  const [email, setEmail] = useStateE("");
  const [state, setState] = useStateE("idle"); // idle | loading | ok | err
  const [msg, setMsg] = useStateE("");

  async function onSubmit(e) {
    e.preventDefault();
    if (!email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
      setState("err"); setMsg("Please enter a valid email."); return;
    }
    setState("loading"); setMsg("");
    try {
      const r = await submitEmail(email, source);
      setState("ok");
      setMsg(r.local
        ? "Saved locally — connect an endpoint to capture real emails."
        : "You're on the list. We'll be in touch.");
      setEmail("");
    } catch (err) {
      setState("err"); setMsg("Something went wrong. Try again?");
    }
  }

  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
      <form className="email-form" onSubmit={onSubmit}>
        <input
          type="email"
          inputMode="email"
          autoComplete="email"
          placeholder={placeholder}
          value={email}
          onChange={(e)=>setEmail(e.target.value)}
          required
        />
        <button className="btn btn-primary" type="submit" disabled={state==="loading"}>
          {state==="loading" ? "Sending…" : cta}
        </button>
      </form>
      <div className={`email-form-msg ${state==="ok"?"is-ok":""} ${state==="err"?"is-err":""}`}>
        {state==="ok" && <Icon.Check/>}
        <span>{msg || (state==="idle" ? "Free 14-day trial · no credit card" : "")}</span>
      </div>
    </div>
  );
}

window.EmailForm = EmailForm;

</script>
<script type="text/babel" data-src="modal.jsx">
// modal.jsx — "Talk to us" lead capture modal
// Global open: window.openTalkModal({ source: "nav-cta" })

const { useState: useStateM, useEffect: useEffectM } = React;

function TalkModal() {
  const [open, setOpen] = useStateM(false);
  const [source, setSource] = useStateM("nav");
  const [form, setForm] = useStateM({ email: "", name: "", company: "", message: "" });
  const [state, setState] = useStateM("idle");
  const [msg, setMsg] = useStateM("");

  useEffectM(() => {
    window.openTalkModal = (opts = {}) => {
      setSource(opts.source || "nav");
      setForm({ email: "", name: "", company: "", message: "" });
      setState("idle"); setMsg("");
      setOpen(true);
    };
    return () => { delete window.openTalkModal; };
  }, []);

  useEffectM(() => {
    if (!open) return;
    document.body.style.overflow = "hidden";
    const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
    window.addEventListener("keydown", onKey);
    return () => { document.body.style.overflow = ""; window.removeEventListener("keydown", onKey); };
  }, [open]);

  if (!open) return null;

  async function submit(e) {
    e.preventDefault();
    if (!form.email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
      setState("err"); setMsg("Please enter a valid email."); return;
    }
    setState("loading"); setMsg("");

    const endpoint = window.CONVERTS_FORM_ENDPOINT;
    const payload = { ...form, source, ts: new Date().toISOString() };

    if (!endpoint || endpoint.startsWith("PASTE_")) {
      const prev = JSON.parse(localStorage.getItem("converts_waitlist") || "[]");
      prev.push(payload);
      localStorage.setItem("converts_waitlist", JSON.stringify(prev));
      await new Promise(r => setTimeout(r, 500));
      setState("ok"); setMsg("Thanks. We'll be in touch within 24 hours.");
      return;
    }

    try {
      const body = new FormData();
      Object.entries(payload).forEach(([k,v]) => body.append(k, v));
      const isAppsScript = endpoint.includes("script.google.com");
      try {
        await fetch(endpoint, { method: "POST", body, mode: isAppsScript ? "no-cors" : "cors", headers: isAppsScript ? undefined : { Accept: "application/json" } });
      } catch (e) {}
    } catch (err) {}
    setState("ok"); setMsg("Thanks. We'll be in touch within 24 hours.");
  }

  return (
    <div className="modal-scrim" onClick={(e)=>{ if (e.target === e.currentTarget) setOpen(false); }}>
      <div className="modal-card" role="dialog" aria-labelledby="talk-title">
        <button className="modal-close" onClick={()=>setOpen(false)} aria-label="Close">×</button>
        {state === "ok" ? (
          <div style={{textAlign:"center",padding:"12px 0"}}>
            <div style={{width:56,height:56,borderRadius:"50%",background:"var(--accent-soft)",color:"var(--accent)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px"}}>
              <Icon.Check style={{width:24,height:24}}/>
            </div>
            <h3 className="modal-title" id="talk-title">You're on the list.</h3>
            <p className="modal-sub" style={{marginBottom:0}}>{msg}</p>
          </div>
        ) : (
          <>
            <p className="modal-eyebrow">Talk to us</p>
            <h3 className="modal-title" id="talk-title">Let's map the agents to your P&amp;L.</h3>
            <p className="modal-sub">A 45-minute working session. We'll quote the lift before you pay anything.</p>
            <form className="modal-form" onSubmit={submit}>
              <input className="modal-input" type="email" placeholder="Work email" autoComplete="email" required value={form.email} onChange={(e)=>setForm(f=>({...f,email:e.target.value}))}/>
              <div className="modal-row">
                <input className="modal-input" type="text" placeholder="Your name" autoComplete="name" value={form.name} onChange={(e)=>setForm(f=>({...f,name:e.target.value}))}/>
                <input className="modal-input" type="text" placeholder="Company" autoComplete="organization" value={form.company} onChange={(e)=>setForm(f=>({...f,company:e.target.value}))}/>
              </div>
              <input className="modal-input" type="text" placeholder="What you'd like to solve (optional)" value={form.message} onChange={(e)=>setForm(f=>({...f,message:e.target.value}))}/>
              <button className="btn btn-primary" type="submit" disabled={state==="loading"}>
                {state==="loading" ? "Sending…" : "Request a session"}
              </button>
              <div className={`modal-msg ${state==="err"?"is-err":""}`}>{msg}</div>
            </form>
          </>
        )}
      </div>
    </div>
  );
}

window.TalkModal = TalkModal;

</script>

function hexToRGB(hex) {
  const h = hex.replace("#","");
  const v = h.length === 3 ? h.split("").map(c=>c+c).join("") : h;
  const n = parseInt(v,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
