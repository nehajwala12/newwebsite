<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Converts AI — Agents for consumer brands, products and services</title>
<style>
/* Converts AI — Apple-esque marketing site */

:root {
  --bg: #ffffff;
  --bg-soft: #fbfbfd;
  --bg-elevated: #f5f5f7;
  --ink: #1d1d1f;
  --ink-2: #424245;
  --ink-3: #6e6e73;
  --ink-4: #86868b;
  --line: rgba(0, 0, 0, 0.08);
  --line-strong: rgba(0, 0, 0, 0.14);
  --accent: #0066cc;
  --accent-ink: #ffffff;
  --accent-soft: rgba(0, 102, 204, 0.08);

  --glass: rgba(255, 255, 255, 0.7);
  --glass-border: rgba(255, 255, 255, 0.6);

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04), 0 1px 1px rgba(0, 0, 0, 0.02);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.10), 0 2px 6px rgba(0, 0, 0, 0.04);

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --radius-xl: 28px;

  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
}

[data-theme="dark"] {
  --bg: #000000;
  --bg-soft: #060607;
  --bg-elevated: #131316;
  --ink: #f5f5f7;
  --ink-2: #d2d2d7;
  --ink-3: #a1a1a6;
  --ink-4: #6e6e73;
  --line: rgba(255, 255, 255, 0.10);
  --line-strong: rgba(255, 255, 255, 0.18);
  --accent: #2997ff;
  --accent-soft: rgba(41, 151, 255, 0.14);
  --glass: rgba(20, 20, 22, 0.7);
  --glass-border: rgba(255, 255, 255, 0.08);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.45), 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.3);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 17px;
  line-height: 1.47;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.01em;
  text-rendering: optimizeLegibility;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

button { font-family: inherit; cursor: default; }

::selection { background: var(--accent); color: var(--accent-ink); }


/* ───── Narrative: value-leak + operating model ───── */
.leak-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-top: 56px;
}
.leak-card {
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--bg);
}
.leak-card-t {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.015em;
  margin: 0 0 8px;
  color: var(--ink);
}
.leak-card-d {
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink-3);
  margin: 0;
  text-wrap: pretty;
}
.waste { margin-top: 80px; }
.waste-head { margin-bottom: 28px; display: flex; flex-direction: column; gap: 14px; }
.waste-strip {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
}
.waste-tile {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 20px 18px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg);
}
.waste-tile-name { font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
.waste-tile-sub { font-size: 12px; color: var(--ink-4); }

/* value-leak graphic */
.leak-graphic { margin-top: 52px; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.leak-graphic svg { width: 100%; min-width: 680px; height: auto; display: block; overflow: visible; }
.lg-band { opacity: 0; transform: translateX(-14px); transition: opacity .9s ease, transform .9s ease; }
.leak-in .lg-band { opacity: 1; transform: none; }
.lg-node { opacity: 0; transition: opacity .6s ease; }
.leak-in .lg-node { opacity: 1; }
.lg-drip { stroke-dasharray: 5 7; opacity: 0; transition: opacity .5s ease; animation: lg-flow 1.1s linear infinite; }
.leak-in .lg-drip { opacity: .5; }
.lg-leakdot, .lg-leaklabel { opacity: 0; transition: opacity .5s ease; }
.leak-in .lg-leakdot, .leak-in .lg-leaklabel { opacity: 1; }
@keyframes lg-flow { to { stroke-dashoffset: -12; } }
@media (prefers-reduced-motion: reduce) {
  .lg-band, .lg-node, .lg-drip, .lg-leakdot, .lg-leaklabel { transition: none; opacity: 1; transform: none; }
  .lg-band { opacity: 1; }
  .lg-drip { animation: none; opacity: .5; }
}

.model-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-top: 64px;
}
.model-step { position: relative; padding-right: 8px; }
.model-step-k {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  margin-bottom: 16px;
}
.model-step-t {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.015em;
  margin: 0 0 10px;
  color: var(--ink);
}
.model-step-d {
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink-3);
  margin: 0;
  text-wrap: pretty;
}
.model-arrow {
  position: absolute;
  top: -2px;
  right: -14px;
  color: var(--ink-4);
  display: flex;
}
.model-quote {
  margin: 80px auto 0;
  max-width: 920px;
  text-align: center;
  font-size: clamp(24px, 2.6vw, 38px);
  line-height: 1.28;
  letter-spacing: -0.02em;
  font-weight: 600;
  color: var(--ink);
  text-wrap: balance;
  border: 0;
  padding: 0;
}
@media (max-width: 900px) {
  .leak-grid { grid-template-columns: 1fr 1fr; }
  .waste-strip { grid-template-columns: repeat(3, 1fr); }
  .model-grid { grid-template-columns: 1fr 1fr; }
  .model-arrow { display: none; }
}
@media (max-width: 620px) {
  .leak-grid { grid-template-columns: 1fr; }
  .waste-strip { grid-template-columns: 1fr 1fr; }
  .model-grid { grid-template-columns: 1fr; }
}

/* ───── how-we-work flow ───── */
.flow { position: relative; margin-top: 64px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.flow-track { position: absolute; top: 36px; left: 12.5%; right: 12.5%; height: 2px; z-index: 0;
  background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--accent) 50%, transparent) 0 6px, transparent 6px 13px);
  animation: flow-move 1.2s linear infinite; }
.flow-step { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; text-align: center; }
.flow-badge { width: 72px; height: 72px; border-radius: 20px; flex: none; display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
  box-shadow: 0 0 0 8px var(--bg); }
.flow-num { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--accent); font-variant-numeric: tabular-nums; margin-top: 18px; }
.flow-title { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; color: var(--ink); margin-top: 7px; }
.flow-cap { font-size: 14px; line-height: 1.45; color: var(--ink-3); margin-top: 6px; max-width: 170px; text-wrap: pretty; }
@keyframes flow-move { to { background-position: 26px 0; } }
@media (prefers-reduced-motion: reduce) { .flow-track { animation: none; } }
@media (max-width: 760px) {
  .flow { grid-template-columns: 1fr 1fr; gap: 40px 20px; }
  .flow-track { display: none; }
}
@media (max-width: 460px) { .flow { grid-template-columns: 1fr; } }

/* ───── Type scale (Apple-style) ───── */
.eyebrow {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 18px;
}
.h-display {
  font-size: clamp(48px, 7.6vw, 104px);
  line-height: 1.04;
  letter-spacing: -0.035em;
  font-weight: 600;
  margin: 0;
  text-wrap: balance;
}
.h-section {
  font-size: clamp(40px, 5vw, 72px);
  line-height: 1.06;
  letter-spacing: -0.028em;
  font-weight: 600;
  margin: 0;
  text-wrap: balance;
}
.h-card {
  font-size: clamp(26px, 2.4vw, 36px);
  line-height: 1.12;
  letter-spacing: -0.02em;
  font-weight: 600;
  margin: 0;
  text-wrap: balance;
}
.lede {
  font-size: clamp(19px, 1.6vw, 24px);
  line-height: 1.35;
  letter-spacing: -0.012em;
  color: var(--ink-2);
  font-weight: 400;
  text-wrap: pretty;
}
.kicker { color: var(--ink-3); }

/* ───── Layout ───── */
.container {
  width: 100%;
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 32px;
}
.container-wide { max-width: 1440px; }
.section { padding: 96px 0; position: relative; }
.section-tight { padding: 60px 0; }

/* ───── Buttons ───── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 44px;
  padding: 0 22px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.005em;
  border: 0;
  transition: transform 120ms ease, background 120ms ease, color 120ms ease, box-shadow 120ms ease;
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 102, 204, 0.32); text-decoration: none; }
.btn-ghost {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line-strong);
}
.btn-ghost:hover { background: var(--bg-elevated); text-decoration: none; }
.btn-sm { height: 34px; padding: 0 14px; font-size: 13px; }
.btn-lg { height: 52px; padding: 0 28px; font-size: 16px; }
.btn-link {
  background: transparent;
  color: var(--accent);
  padding: 0;
  height: auto;
}
.btn-link:hover { text-decoration: underline; }
.btn-link::after { content: " ›"; }

/* ───── Email form ───── */
.email-form {
  margin-top: 36px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 6px 6px 18px;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  box-shadow: var(--shadow-md);
  width: min(440px, 92vw);
  transition: border-color 160ms ease, box-shadow 160ms ease;
}
.email-form:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow-md);
}
.email-form input {
  flex: 1;
  min-width: 0;
  height: 44px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 15px;
  letter-spacing: -0.005em;
}
.email-form input::placeholder { color: var(--ink-4); }
.email-form .btn { flex-shrink: 0; }
.email-form-msg {
  margin: 14px auto 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 13.5px;
  color: var(--ink-3);
  min-height: 20px;
}
.email-form-msg.is-ok { color: #16a34a; }
.email-form-msg.is-err { color: #dc2626; }
.email-form-secondary {
  margin-top: 14px;
  font-size: 13px;
  color: var(--ink-3);
}
.email-form-secondary a { color: var(--ink-2); }

/* ───── Nav ───── */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  height: 52px;
  display: flex;
  align-items: center;
  background: rgba(255,255,255,0.72);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line);
}
[data-theme="dark"] .nav { background: rgba(0,0,0,0.72); }
.nav-inner {
  width: 100%;
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--ink);
}
.nav-brand:hover { text-decoration: none; }
.nav-logo { height: 68px; width: auto; border-radius: 12px; display: block; }
.foot-logo { height: 40px; width: auto; border-radius: 8px; display: block; }
.nav-links {
  display: flex;
  gap: 28px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.nav-links a {
  color: var(--ink-2);
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
.nav-links a:hover { color: var(--ink); text-decoration: none; }
.nav-cta { display: flex; gap: 10px; align-items: center; }

/* ───── Hero ───── */
.hero {
  position: relative;
  padding: 168px 0 148px;
  min-height: 86vh;
  display: flex;
  align-items: center;
  text-align: center;
  overflow: hidden;
}
.hero-bg {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(60% 40% at 20% 20%, rgba(120, 165, 255, 0.22), transparent 60%),
    radial-gradient(50% 50% at 80% 30%, rgba(199, 154, 255, 0.18), transparent 60%),
    radial-gradient(60% 40% at 50% 90%, rgba(120, 220, 220, 0.18), transparent 60%);
  filter: blur(40px);
  z-index: 0;
}
[data-theme="dark"] .hero-bg {
  background:
    radial-gradient(60% 40% at 20% 20%, rgba(60, 110, 255, 0.32), transparent 60%),
    radial-gradient(50% 50% at 80% 30%, rgba(170, 90, 255, 0.28), transparent 60%),
    radial-gradient(60% 40% at 50% 90%, rgba(40, 180, 200, 0.22), transparent 60%);
}
.hero-inner { position: relative; z-index: 1; }
.hero-cta { display: inline-flex; gap: 12px; margin-top: 36px; }

/* ── Hero centered (Coframe-style rotating phrase) ── */
.hero .hero-inner.hero-c { max-width: 1180px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.hero-c .hero-head { font-size: clamp(56px, 8.4vw, 124px); line-height: 1.02; letter-spacing: -0.035em; margin: 0; }
.hero-actions-c { justify-content: center; margin-top: 44px; }
.hero-stage-c { width: 100%; max-width: 1040px; margin: 72px auto 0; }

.hero-rot { position: relative; width: 100%; height: 1.5em; margin-top: 30px;
  font-size: clamp(22px, 3.1vw, 44px); font-weight: 650; letter-spacing: -0.02em; }
.hero-rot-line { position: absolute; left: 0; right: 0; top: 0; height: 100%;
  display: flex; align-items: center; justify-content: center; gap: 0.4em; white-space: nowrap;
  opacity: 0; transform: translateY(46%);
  transition: opacity .62s cubic-bezier(.4,0,.2,1), transform .72s cubic-bezier(.33,0,.2,1);
  will-change: opacity, transform; }
.hero-split .hero-rot { margin: 0 0 18px; font-size: clamp(20px, 2.1vw, 30px); }
.hero-split .hero-rot-line { justify-content: flex-start; }
.hero-rot-line.is-on { opacity: 1; transform: translateY(0); }
.hero-rot-line.is-out { opacity: 0; transform: translateY(-46%); }
.hero-rot-ic { display: inline-flex; align-items: center; justify-content: center;
  width: 1.18em; height: 1.18em; border-radius: 0.32em; background: var(--accent-soft); color: var(--accent); flex: none; }
.hero-rot-ic svg { width: 0.6em; height: 0.6em; }
.hero-rot-lead { color: var(--ink-2); }
.hero-rot-out { color: var(--accent); font-weight: 780; }
@media (prefers-reduced-motion: reduce) {
  .hero-rot { height: auto; }
  .hero-rot-line { position: relative; opacity: 1; transform: none; }
  .hero-rot-line:not(:first-child) { display: none; }
}
@media (max-width: 620px) { .hero-rot-line { white-space: normal; line-height: 1.18; } .hero-rot { height: 2.5em; } }

.hero-ebitda { color: var(--accent); }

/* ── Hero split: text left, P&L right ── */
.hero-split { display: grid; grid-template-columns: minmax(300px, 0.58fr) minmax(0, 1.42fr); gap: 64px; align-items: stretch; text-align: left; width: 100%; }
.hero .hero-inner.hero-split { max-width: 1480px; }
.hero-split .hero-right { transform: translateX(164px); display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; }
.hero-split .hero-right .hero-rot { margin: 0 0 22px; align-self: stretch; }
.hero-split .hero-right .hero-rot-line { justify-content: center; }
.hero-split .hero-right .hero-stage { width: 98.5%; display: flex; align-items: center; margin-left: auto; }
.hero-split .hero-right .prodframe { width: 100%; }
.hero-trust { width: 100%; max-width: 1280px; margin: -140px auto 0; padding: 0 24px 64px; text-align: center; position: relative; z-index: 2; }
.hero-trust-label { margin: 0 0 20px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-4); font-weight: 500; }
.hero-trust-row { display: flex; flex-wrap: nowrap; align-items: center; justify-content: center; gap: 12px 14px; }
.hero-trust-logo { display: inline-flex; align-items: center; justify-content: center; height: 72px; padding: 0 22px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,0.05); flex: 0 1 auto; }
.hero-trust-logo img { max-height: 36px; max-width: 160px; width: auto; object-fit: contain; display: block; }
@media (max-width: 980px) { .hero-trust { margin-top: 44px; padding-left: 20px; padding-right: 20px; } .hero-trust-row { flex-wrap: wrap; } }
.hero-actions { display: flex; gap: 14px; margin-top: 40px; flex-wrap: wrap; }
.hero-qual { margin: 22px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-4); max-width: 440px; }
.hero-pnl-head { margin: 0 0 20px; }
.hero-pnl-title { display: inline-flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 650; letter-spacing: -0.015em; color: var(--ink); margin: 0; }
.hero-pnl-title svg { width: 18px; height: 18px; color: var(--accent); flex: none; }
.hero-pnl-sub { font-size: 14px; line-height: 1.5; color: var(--ink-3); margin: 6px 0 0; max-width: 560px; text-wrap: pretty; }
.hero-split .hero-left, .hero-split .hero-right { min-width: 0; }
.hero-split .eyebrow, .hero-split .h-display, .hero-split .lede { text-align: left; }
.hero-split .h-display { font-size: clamp(52px, 6.6vw, 104px); line-height: 1.02; letter-spacing: -0.035em; }
.hero-split .lede { margin: 22px 0 0 !important; }
.hero-split .hero-stats { margin: 40px 0 0; grid-template-columns: 1fr 1fr; max-width: none; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.hero-split .hero-stat:nth-child(odd) { border-right: 1px solid var(--line); }
.hero-split .hero-stat:nth-child(even) { border-right: 0; }
.hero-split .hero-stat:nth-child(1), .hero-split .hero-stat:nth-child(2) { border-bottom: 1px solid var(--line); }
.hero-split .hero-stat-num { font-size: 26px; }

/* embedded P&L card in hero */
.pnl-embed { width: 100%; }
.pnl-embed-head { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.pnl-embed-cap { font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
.pnl-table.is-compact .pnl-row, .pnl-table.is-compact .pnl-row.pnl-header { grid-template-columns: 1.7fr 1fr 1.15fr 1fr; padding-left: 22px; padding-right: 22px; }
.pnl-table.is-compact .pnl-row.is-pct { padding-left: 22px; padding-right: 22px; }
.pnl-table.is-compact .pnl-cell.agents { display: none; }

@media (max-width: 980px) {
  .hero-split { grid-template-columns: 1fr; gap: 44px; text-align: center; }
  .hero-split .hero-right { transform: none; }
  .hero-split .eyebrow, .hero-split .h-display { text-align: center; }
  .hero-actions { justify-content: center; }
  .hero-qual { margin-left: auto; margin-right: auto; text-align: center; }
  .hero-pnl-label { text-align: center; }
}

/* ───── Glass card ───── */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
}

/* ───── Mode split (Connected / Standalone) ───── */
.modes {
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
}
.mode-tabs {
  display: inline-flex;
  padding: 4px;
  background: var(--bg-elevated);
  border-radius: 999px;
  border: 1px solid var(--line);
  margin: 28px auto 0;
}
.mode-tab {
  padding: 9px 20px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-3);
  background: transparent;
  border: 0;
  transition: color 120ms ease, background 120ms ease;
}
.mode-tab[aria-selected="true"] {
  background: var(--bg);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}
.mode-stage {
  margin-top: 64px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.mode-card {
  position: relative;
  border-radius: var(--radius-xl);
  padding: 44px 40px;
  min-height: 520px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--bg-soft);
  display: flex;
  flex-direction: column;
}
.mode-card.is-connected {
  background:
    radial-gradient(120% 100% at 0% 0%, rgba(0, 102, 204, 0.10), transparent 60%),
    radial-gradient(120% 100% at 100% 100%, rgba(120, 80, 255, 0.08), transparent 60%),
    var(--bg-soft);
}
.mode-card.is-standalone {
  background:
    radial-gradient(120% 100% at 100% 0%, rgba(255, 200, 120, 0.10), transparent 60%),
    radial-gradient(120% 100% at 0% 100%, rgba(120, 220, 220, 0.10), transparent 60%),
    var(--bg-soft);
}
.mode-card .mode-eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  gap: 8px;
}
.mode-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.mode-card.is-standalone .mode-dot { background: #e8a663; box-shadow: 0 0 0 4px rgba(232,166,99,0.18); }
.mode-card h3 {
  font-size: 36px;
  letter-spacing: -0.02em;
  line-height: 1.1;
  font-weight: 600;
  margin: 16px 0 12px;
}
.mode-card p {
  color: var(--ink-2);
  font-size: 17px;
  line-height: 1.5;
  margin: 0 0 24px;
  max-width: 38ch;
}
.mode-card .mode-visual {
  margin-top: auto;
  flex: 1;
  min-height: 260px;
  position: relative;
}

/* ───── Use case grid ───── */
.uc-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 20px;
  margin-top: 64px;
}
.uc-card {
  position: relative;
  border-radius: var(--radius-xl);
  padding: 36px;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 380px;
  transition: transform 200ms ease, box-shadow 200ms ease;
}
.uc-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.uc-card.col-6 { grid-column: span 6; }
.uc-card.col-4 { grid-column: span 4; }
.uc-card.col-8 { grid-column: span 8; }
.uc-card.col-12 { grid-column: span 12; }
.uc-card.is-dark {
  background: #0a0a0c;
  color: #f5f5f7;
  border-color: rgba(255,255,255,0.08);
}
.uc-card.is-dark .kicker { color: rgba(255,255,255,0.6); }
.uc-card.is-dark p { color: rgba(255,255,255,0.7); }
.uc-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  background: var(--bg);
  border: 1px solid var(--line);
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-2);
  letter-spacing: 0.02em;
  width: fit-content;
}
.uc-tag.is-conn { color: var(--accent); border-color: rgba(0,102,204,0.25); background: var(--accent-soft); }
.uc-tag.is-stand { color: #c87a3a; border-color: rgba(200,122,58,0.3); background: rgba(232,166,99,0.10); }
.uc-card h3 {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.018em;
  line-height: 1.15;
  margin: 16px 0 10px;
}
.uc-card p {
  color: var(--ink-2);
  font-size: 15.5px;
  line-height: 1.5;
  margin: 0 0 20px;
}
.uc-visual {
  margin-top: auto;
  border-radius: var(--radius-md);
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 14px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-2);
  min-height: 140px;
}
.uc-card.is-dark .uc-visual { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.08); color: rgba(255,255,255,0.85); }

/* ───── Meet your agents ───── */
.agents-sec { background: var(--bg); }
.agents-head { text-align: center; max-width: 640px; margin: 0 auto 64px; }
.pillars { display: flex; flex-direction: column; gap: 56px; }
.pillar { }
.pillar-head {
  display: flex;
  align-items: center;
  gap: 16px;
  padding-bottom: 20px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--line);
}
.pillar-ic {
  width: 44px; height: 44px;
  flex: none;
  border-radius: 12px;
  background: var(--accent-soft);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
}
.pillar-title {
  font-size: clamp(22px, 2.2vw, 28px);
  font-weight: 600;
  letter-spacing: -0.018em;
  color: var(--ink);
  margin: 0;
  line-height: 1.1;
}
.pillar-sub {
  font-size: 14.5px;
  color: var(--ink-3);
  margin: 4px 0 0;
}
.pillar-metric { margin-left: auto; flex: none; text-align: right; line-height: 1; }
.pillar-metric-val {
  display: block;
  font-size: clamp(20px, 2vw, 27px);
  font-weight: 650;
  letter-spacing: -0.025em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.pillar-metric-lbl {
  display: block;
  margin-top: 6px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-4);
}
.agent-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
.agent-card {
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 12px 12px 14px;
  transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
}
.agent-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
  border-color: var(--line-strong);
}
.agent-viz {
  height: 192px;
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  border: 1px solid var(--line);
  perspective: 900px;
  perspective-origin: 50% 36%;
  background:
    radial-gradient(120% 92% at 88% 120%, var(--accent-soft) 0%, rgba(255,255,255,0) 50%),
    radial-gradient(90% 80% at 4% -20%, rgba(124,58,237,0.10) 0%, rgba(255,255,255,0) 46%),
    linear-gradient(168deg, var(--bg) 0%, var(--bg-elevated) 100%);
  margin-bottom: 12px;
}
.agent-viz::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(currentColor 1px, transparent 1.4px);
  background-size: 15px 15px;
  color: var(--ink);
  opacity: 0.04;
  pointer-events: none;
  z-index: 0;
}
.agent-viz::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), inset 0 -52px 64px -46px rgba(16,24,40,0.17);
  pointer-events: none;
  z-index: 9;
}
.av-root {
  position: absolute; inset: 0; z-index: 1;
  transform-style: preserve-3d;
  transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition: transform 0.55s cubic-bezier(.2,.7,.2,1);
}
.av-root.tilting { transition: transform 0.1s ease-out; }
.av-glow {
  position: absolute; right: -20px; bottom: -28px;
  width: 132px; height: 132px; border-radius: 50%;
  background: radial-gradient(circle, var(--accent) 0%, rgba(255,255,255,0) 68%);
  opacity: 0.16; filter: blur(18px); pointer-events: none;
  transform: translateZ(-55px);
  animation: avGlow 6s ease-in-out infinite;
}
.av-glow.v {
  right: auto; left: -30px; top: -34px; width: 156px; height: 156px;
  background: radial-gradient(circle, #7c3aed 0%, rgba(255,255,255,0) 70%);
  opacity: 0.12; filter: blur(22px); transform: translateZ(-72px); animation: none;
}
.av-spot {
  position: absolute; inset: 18px; border-radius: 12px; z-index: 7;
  pointer-events: none; opacity: 0; transition: opacity 0.3s ease;
  background: radial-gradient(150px 150px at var(--sx, 50%) var(--sy, 24%), rgba(255,255,255,0.34), rgba(255,255,255,0) 62%);
  mix-blend-mode: soft-light; transform: translateZ(1px);
}
.agent-card:hover .av-spot { opacity: 1; }

/* ── Agent visual kit (mini product-UI fragments) ── */
.av-card {
  position: absolute;
  inset: 18px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.6),
    0 22px 42px -18px rgba(16,24,40,0.34),
    0 4px 10px -3px rgba(16,24,40,0.12);
  padding: 12px 13px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.av-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.av-label {
  font-size: 9px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--ink-4); line-height: 1; white-space: nowrap;
}
.av-num {
  font-size: 21px; font-weight: 650; letter-spacing: -0.03em; line-height: 1;
  color: var(--ink); font-variant-numeric: tabular-nums;
}
.av-sub { font-size: 10px; color: var(--ink-3); line-height: 1; letter-spacing: -0.01em; }
.av-pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 600; letter-spacing: -0.01em; line-height: 1;
  padding: 3px 7px; border-radius: 999px;
  background: var(--bg-elevated); color: var(--ink-2); border: 1px solid var(--line);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.av-pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.av-pill.good  { background: rgba(34,197,94,0.13); color: #16a34a; border-color: transparent; }
.av-pill.warn  { background: rgba(245,158,11,0.15); color: #b45309; border-color: transparent; }
.av-spark { display: block; width: 100%; height: 100%; }
.av-thumb {
  border-radius: 6px;
  background: linear-gradient(150deg, var(--accent-soft), var(--bg-elevated));
  border: 1px solid var(--line); flex: none;
}
.av-bar-track { background: var(--bg-elevated); border-radius: 999px; overflow: hidden; flex: 1; }
.av-bar-fill { height: 100%; border-radius: 999px; background: var(--accent); }
.av-bar-fill.good { background: #22c55e; }
.av-bar-fill.mut { background: var(--ink-4); opacity: 0.5; }
.av-line { height: 4px; border-radius: 999px; background: var(--ink); opacity: 0.13; }
.av-chip {
  font-size: 9.5px; font-weight: 600; color: var(--ink-2); line-height: 1;
  padding: 3px 6px; border-radius: 6px; background: var(--bg-elevated);
  border: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.av-chip.on { background: var(--accent); color: #fff; border-color: transparent; }
.av-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

/* depth + realism */
.av-tip {
  position: absolute; z-index: 4;
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 650; letter-spacing: -0.01em; line-height: 1;
  color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px;
  box-shadow: 0 10px 20px -8px rgba(16,24,40,0.34);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.av-tip.accent { border-color: transparent; box-shadow: 0 0 0 1px var(--accent) inset, 0 8px 22px -6px var(--accent-soft), 0 10px 20px -10px rgba(16,24,40,0.3); color: var(--accent); }
.av-cursor { position: absolute; z-index: 6; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.28)); }
.av-marker {
  position: absolute; width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 3px var(--bg), 0 0 12px 2px var(--accent);
  transform: translate(-50%, -50%); z-index: 3;
}
.av-marker::after {
  content: ""; position: absolute; inset: -3px; border-radius: 50%;
  border: 1.5px solid var(--accent);
  animation: avPing 2.4s cubic-bezier(.2,.7,.2,1) infinite;
}
@keyframes avPing {
  0% { transform: scale(1); opacity: 0.75; }
  70%, 100% { transform: scale(2.6); opacity: 0; }
}
.av-donut {
  position: relative; flex: none; border-radius: 50%;
  background: conic-gradient(var(--accent) calc(var(--p, 60) * 1%), var(--bg-elevated) 0);
  -webkit-mask: radial-gradient(farthest-side, #0000 60%, #000 61%);
          mask: radial-gradient(farthest-side, #0000 60%, #000 61%);
}
.av-brand { width: 15px; height: 15px; border-radius: 5px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
.av-brand.meta   { background: #0866ff; }
.av-brand.google { background: conic-gradient(#ea4335, #fbbc05, #34a853, #4285f4, #ea4335); }
.av-brand.tiktok { background: #111; }

/* ── motion (entrance gated on .is-in; ambient kept subtle) ── */
.av-glow { animation: avGlow 5.5s ease-in-out infinite; }
.av-draw { stroke-dasharray: 1; stroke-dashoffset: 0; }
.av-rise, .av-pop, .av-grow, .av-wide { /* final state by default */ }
.av-grow { transform-origin: bottom; }
.av-wide { transform-origin: left; }
.av-root.is-in .av-draw { animation: avDraw 1.2s cubic-bezier(.4,0,.2,1) both; }
.av-root.is-in .av-area { animation: avFade 1s ease both; }
.av-root.is-in .av-rise { animation: avRise .7s cubic-bezier(.2,.7,.2,1) both; }
.av-root.is-in .av-pop  { animation: avPop .6s cubic-bezier(.2,1.4,.4,1) both; }
.av-root.is-in .av-grow { animation: avGrow .8s cubic-bezier(.2,.8,.2,1) both; }
.av-root.is-in .av-wide { animation: avWide .9s cubic-bezier(.2,.8,.2,1) both; }
.av-root.is-in .av-d1 { animation-delay: .08s; }
.av-root.is-in .av-d2 { animation-delay: .18s; }
.av-root.is-in .av-d3 { animation-delay: .28s; }
.av-root.is-in .av-d4 { animation-delay: .38s; }
.av-flow { stroke-dasharray: 5 7; animation: avDash 1.1s linear infinite; }
.av-pulse { transform-origin: center; animation: avPulse 2.6s ease-in-out infinite; }
@keyframes avPulse { 0%,100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 0; transform: scale(1.9); } }
.av-shimmer {
  background: linear-gradient(100deg, var(--bg-elevated) 30%, var(--accent-soft) 50%, var(--bg-elevated) 70%);
  background-size: 240% 100%;
  animation: avShimmer 1.6s linear infinite;
}
@keyframes avDraw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes avFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes avRise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
@keyframes avPop  { from { opacity: 0; transform: scale(.78); } to { opacity: 1; transform: scale(1); } }
@keyframes avGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes avWide { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes avGlow { 0%,100% { opacity: .12; } 50% { opacity: .26; } }
@keyframes avDash { to { stroke-dashoffset: -24; } }
@keyframes avShimmer { 0% { background-position: 120% 0; } 100% { background-position: -120% 0; } }
@media (prefers-reduced-motion: reduce) {
  .agent-viz *, .av-glow { animation: none !important; }
  .av-draw { stroke-dashoffset: 0 !important; }
}
.agent-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 2px;
}
.agent-name {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin: 0;
}
.agent-impact {
  flex: none;
  font-size: 11.5px;
  font-weight: 650;
  letter-spacing: -0.01em;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 7px;
  padding: 4px 8px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* card with an embedded video demo */
.agent-card.has-video { cursor: pointer; }
.agent-card.has-video .agent-viz { position: relative; }
/* inline muted preview that plays on hover */
.agent-poster {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: inherit;
  z-index: 6;
}
.agent-inline-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: inherit;
  z-index: 7;
  opacity: 0;
  transition: opacity 0.35s ease;
  pointer-events: none;
}
.agent-card.has-video:hover .agent-inline-video { opacity: 1; }
/* "tap for sound" hint, appears on hover/focus */
.agent-hint {
  position: absolute;
  left: 9px; bottom: 9px;
  z-index: 8;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 0;
  cursor: pointer;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: -0.01em;
  color: #fff;
  background: rgba(0,0,0,0.52);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  border-radius: 999px;
  padding: 5px 10px;
  opacity: 0;
  transform: translateY(5px);
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.agent-card.has-video:hover .agent-hint,
.agent-hint:focus-visible { opacity: 1; transform: none; }
/* persistent "has video" affordance even before hover */
.agent-video-badge {
  position: absolute;
  top: 9px; right: 9px;
  z-index: 6;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--bg);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  padding-left: 1px;
  box-shadow: 0 3px 10px -2px rgba(0,0,0,0.3), inset 0 0 0 1px var(--line);
  transition: opacity 0.2s ease;
  pointer-events: none;
}
.agent-card.has-video:hover .agent-video-badge { opacity: 0; }
/* centered play button — signals the card is a playable video */
.agent-play {
  position: absolute;
  inset: 0;
  margin: auto;
  width: 56px; height: 56px;
  border-radius: 50%;
  z-index: 8;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-left: 3px;
  color: var(--accent);
  background: rgba(255,255,255,0.94);
  box-shadow: 0 8px 24px -6px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(0,0,0,0.04);
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.agent-card.has-video:hover .agent-play { opacity: 0; transform: scale(0.8); }

/* ── P&L pillar legend ── */
.pnl-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 20px;
  margin-bottom: 20px;
}
.pnl-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--ink-2);
}
.pnl-legend-dot {
  width: 11px; height: 11px;
  border-radius: 3px;
  flex: none;
}
.pnl-legend-dot.is-rev  { background: #0066cc; }
.pnl-legend-dot.is-cogs { background: #16863e; }
.pnl-legend-dot.is-mkt  { background: #6d28d9; }
.pnl-legend-dot.is-ops  { background: #c2410c; }
[data-theme="dark"] .pnl-legend-dot.is-rev  { background: #6cb9ff; }
[data-theme="dark"] .pnl-legend-dot.is-cogs { background: #7ce198; }
[data-theme="dark"] .pnl-legend-dot.is-mkt  { background: #c4b5fd; }
[data-theme="dark"] .pnl-legend-dot.is-ops  { background: #fdba74; }

/* ── Video lightbox ── */
.vid-scrim {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(10,12,18,0.72);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 5vh 24px;
  animation: vidIn 0.2s ease;
}
@keyframes vidIn { from { opacity: 0; } to { opacity: 1; } }
.vid-modal {
  width: min(960px, 100%);
  border-radius: 16px;
  overflow: hidden;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  box-shadow: 0 40px 90px -20px rgba(0,0,0,0.6);
  animation: vidPop 0.26s cubic-bezier(.2,.8,.3,1);
}
@keyframes vidPop { from { transform: translateY(12px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }
.vid-modal .demo-titlebar { position: relative; }
.vid-close {
  position: absolute;
  right: 12px; top: 50%;
  transform: translateY(-50%);
  width: 26px; height: 26px;
  border: 0;
  border-radius: 50%;
  background: var(--bg-elevated);
  color: var(--ink-2);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.vid-close:hover { background: var(--line-strong); color: var(--ink); }
.vid-body {
  position: relative;
  aspect-ratio: 16 / 9;
  background: #000;
}
.vid-el {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
@media (max-width: 860px) {
  .agent-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 560px) {
  .agent-grid { grid-template-columns: 1fr; }
}

/* ───── Real agent video ───── */
.video-sec { background: linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%); padding-top: 64px; }
.video-head { text-align: center; max-width: 640px; margin: 0 auto; }
.video-head .lede { margin: 18px auto 0; }
.video-window {
  margin: 56px auto 0;
  max-width: 1040px;
  border-radius: 18px;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.video-body {
  position: relative;
  aspect-ratio: 16 / 9;
  background: #000;
}
.video-el {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  cursor: pointer;
}
.video-overlay {
  position: absolute;
  inset: 0;
  border: 0;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  background:
    radial-gradient(70% 70% at 50% 50%, rgba(0,0,0,0.10), rgba(0,0,0,0.55) 100%),
    linear-gradient(180deg, rgba(0,102,204,0.18), rgba(120,80,255,0.12));
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
  transition: opacity 200ms ease;
}
.video-overlay:hover { opacity: 0.94; }
.video-play {
  width: 78px;
  height: 78px;
  border-radius: 50%;
  background: rgba(255,255,255,0.92);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  padding-left: 4px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  transition: transform 160ms ease;
}
.video-overlay:hover .video-play { transform: scale(1.06); }
.video-cap {
  color: #fff;
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: 0.01em;
  text-shadow: 0 1px 8px rgba(0,0,0,0.4);
}

/* ───── Demo ───── */
.demo-window {
  margin-top: 64px;
  border-radius: 18px;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.demo-titlebar {
  height: 36px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--line);
}
.tl-dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(0,0,0,0.12); }
.tl-dot.r { background: #ff5f57; }
.tl-dot.y { background: #febc2e; }
.tl-dot.g { background: #28c840; }
.demo-title {
  flex: 1;
  text-align: center;
  font-size: 12px;
  color: var(--ink-3);
  font-weight: 500;
  letter-spacing: -0.005em;
}
.demo-body {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 580px;
}
.demo-side {
  background: var(--bg-soft);
  border-right: 1px solid var(--line);
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.demo-side-label {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-4);
  padding: 12px 10px 6px;
}
.demo-side-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13.5px;
  color: var(--ink-2);
  border: 0;
  background: transparent;
  text-align: left;
  width: 100%;
}
.demo-side-item:hover { background: rgba(0,0,0,0.04); }
.demo-side-item.is-active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
[data-theme="dark"] .demo-side-item:hover { background: rgba(255,255,255,0.06); }
.demo-side-icon {
  width: 18px; height: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  color: currentColor;
}
.demo-main {
  padding: 28px 32px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  background: var(--bg);
}

/* ───── Integrations ───── */
.intg-strip {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 12px;
  margin-top: 48px;
}
.intg-tile {
  aspect-ratio: 1.4;
  border-radius: var(--radius-md);
  background: var(--bg-soft);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  letter-spacing: -0.005em;
  transition: transform 200ms ease;
}
.intg-tile:hover { transform: translateY(-2px); }

/* ───── Logos ───── */
.logos {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin-top: 32px;
  align-items: center;
}
.logo-item {
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-3);
  font-weight: 600;
  font-size: 17px;
  letter-spacing: -0.01em;
  opacity: 0.78;
}

/* ───── Pricing ───── */
.pricing-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 64px;
}
.price-card {
  border-radius: var(--radius-xl);
  padding: 36px 32px;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.price-card.is-featured {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.price-card.is-featured .kicker,
.price-card.is-featured .price-feat li { color: rgba(255,255,255,0.7); }
.price-card.is-featured .btn-ghost { color: var(--bg); border-color: rgba(255,255,255,0.25); }
.price-card.is-featured .btn-ghost:hover { background: rgba(255,255,255,0.08); }
.price-num {
  font-size: 56px;
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1;
}
.price-feat {
  list-style: none;
  margin: 0;
  padding: 16px 0 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-top: 1px solid var(--line);
  font-size: 14px;
  color: var(--ink-2);
}
.price-card.is-featured .price-feat { border-top-color: rgba(255,255,255,0.14); }

/* ───── Footer CTA ───── */
.cta-final {
  padding: 160px 32px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.cta-final-bg {
  position: absolute; inset: 0; z-index: 0;
  background:
    radial-gradient(60% 60% at 50% 40%, rgba(0,102,204,0.18), transparent 70%),
    radial-gradient(40% 40% at 30% 70%, rgba(170,90,255,0.16), transparent 70%),
    radial-gradient(40% 40% at 70% 70%, rgba(40,180,200,0.16), transparent 70%);
  filter: blur(30px);
}
.cta-final-inner { position: relative; z-index: 1; }

footer.foot {
  border-top: 1px solid var(--line);
  padding: 44px 0 40px;
  font-size: 12px;
  color: var(--ink-3);
}
.foot-row {
  display: block;
}
.foot-col h5 {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  margin: 0 0 14px;
  letter-spacing: -0.005em;
}
.foot-col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.foot-col a { color: var(--ink-3); font-size: 12.5px; }
.foot-col a:hover { color: var(--ink); text-decoration: none; }
.foot-bottom {
  margin-top: 28px;
  padding-top: 22px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
}

/* ───── Talk to us modal ───── */
.modal-scrim {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0,0,0,0.55);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  animation: scrimIn 220ms ease;
}
@keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
.modal-card {
  width: 100%;
  max-width: 480px;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: 22px;
  padding: 36px 36px 32px;
  box-shadow: var(--shadow-lg);
  position: relative;
  animation: modalIn 280ms cubic-bezier(.2,.8,.2,1) both;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(12px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 0;
  background: var(--bg-elevated);
  color: var(--ink-2);
  font-size: 17px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-close:hover { background: var(--line); color: var(--ink); }
.modal-eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 12px;
}
.modal-title {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin: 0 0 8px;
}
.modal-sub {
  color: var(--ink-3);
  font-size: 15px;
  line-height: 1.5;
  margin: 0 0 24px;
}
.modal-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.modal-input {
  width: 100%;
  height: 48px;
  padding: 0 18px;
  background: var(--bg-soft);
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  outline: 0;
  letter-spacing: -0.005em;
  transition: border-color 160ms ease, box-shadow 160ms ease;
}
.modal-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.modal-input::placeholder { color: var(--ink-4); }
.modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-form .btn-primary { height: 48px; padding: 0; justify-content: center; margin-top: 4px; }
.modal-msg {
  font-size: 13px;
  color: var(--ink-3);
  margin-top: 8px;
  text-align: center;
  min-height: 18px;
}
.modal-msg.is-ok { color: #16a34a; }
.modal-msg.is-err { color: #dc2626; }
@media (max-width: 560px) {
  .modal-card { padding: 28px 24px 24px; border-radius: 18px; }
  .modal-row { grid-template-columns: 1fr; }
}

/* ───── Visuals: tiny chart ───── */
.spark { width: 100%; height: 80px; }
.spark path.line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark path.area { fill: var(--accent-soft); }
.spark .pred { stroke-dasharray: 4 4; opacity: 0.7; }

/* ───── Stats row ───── */
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 80px; }
.stat-row .stat { padding: 28px 0; border-top: 1px solid var(--line); }
.stat-num { font-size: 56px; font-weight: 600; letter-spacing: -0.025em; line-height: 1; }
.stat-lbl { color: var(--ink-3); margin-top: 10px; font-size: 14px; }

/* ───── Hero stats band (PE/CEO proof strip) ───── */
.hero-stats {
  margin: 56px auto 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  max-width: 980px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--bg);
}
.hero-stat {
  padding: 24px 20px;
  text-align: left;
  border-right: 1px solid var(--line);
}
.hero-stat:last-child { border-right: 0; }
.hero-stat-num {
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1;
  color: var(--ink);
}
.hero-stat-lbl {
  font-size: 12.5px;
  color: var(--ink-3);
  margin-top: 8px;
  line-height: 1.35;
  letter-spacing: -0.005em;
}

/* ───── P&L table ───── */
.pnl-head { margin-bottom: 56px; }
.pnl-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 32px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink-2);
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
.pnl-pill.is-on {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: rgba(0,102,204,0.25);
}
.pnl-table {
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  background: var(--bg);
  overflow: hidden;
  box-shadow: var(--shadow-md);
}
.pnl-row {
  display: grid;
  grid-template-columns: 1.4fr 0.9fr 0.9fr 0.7fr 2.1fr;
  align-items: center;
  padding: 16px 28px;
  border-bottom: 1px solid var(--line);
  font-size: 14.5px;
}
.pnl-row:last-child { border-bottom: 0; }
.pnl-row.pnl-header {
  background: var(--bg-soft);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: 14px 28px;
}
.pnl-row.is-subtotal {
  font-weight: 600;
  background: var(--bg-soft);
}
.pnl-row.is-highlight {
  background: linear-gradient(90deg, rgba(0,102,204,0.06), rgba(120,80,255,0.04));
  font-weight: 600;
}
.pnl-row.is-pct {
  font-size: 12.5px;
  color: var(--ink-3);
  padding: 10px 28px;
}
.pnl-row.is-pct.is-highlight {
  color: var(--accent);
  background: var(--accent-soft);
  font-weight: 600;
}
.pnl-cell.line { color: var(--ink); }
.pnl-row.is-pct .pnl-cell.line { color: inherit; }
.pnl-cell.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
}
.pnl-cell.num.strong { color: var(--ink); font-weight: 600; }
.pnl-cell.num.delta.is-up { color: #16a34a; }
.pnl-cell.num.delta.is-down { color: #16a34a; }
.pnl-cell.agents {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding-left: 28px;
}
.pnl-agent {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
.pnl-agent.is-accent {
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid rgba(0,102,204,0.18);
}
.pnl-agent.is-warn {
  background: rgba(232,166,99,0.12);
  color: #c87a3a;
  border: 1px solid rgba(200,122,58,0.22);
}
/* Per-line P&L tones */
.pnl-agent.is-rev {
  background: rgba(0,102,204,0.10);
  color: #0066cc;
  border: 1px solid rgba(0,102,204,0.22);
}
.pnl-agent.is-cogs {
  background: rgba(22,163,74,0.10);
  color: #16863e;
  border: 1px solid rgba(22,163,74,0.22);
}
.pnl-agent.is-mkt {
  background: rgba(124,58,237,0.10);
  color: #6d28d9;
  border: 1px solid rgba(124,58,237,0.22);
}
.pnl-agent.is-ops {
  background: rgba(232,118,99,0.12);
  color: #c2410c;
  border: 1px solid rgba(232,118,99,0.24);
}
[data-theme="dark"] .pnl-agent.is-rev {
  background: rgba(41,151,255,0.16); color: #6cb9ff; border-color: rgba(41,151,255,0.28);
}
[data-theme="dark"] .pnl-agent.is-cogs {
  background: rgba(34,197,94,0.14); color: #7ce198; border-color: rgba(34,197,94,0.28);
}
[data-theme="dark"] .pnl-agent.is-mkt {
  background: rgba(167,139,250,0.14); color: #c4b5fd; border-color: rgba(167,139,250,0.28);
}
[data-theme="dark"] .pnl-agent.is-ops {
  background: rgba(251,146,60,0.14); color: #fdba74; border-color: rgba(251,146,60,0.28);
}
.pnl-foot {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  margin-top: 32px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.pnl-foot-stat {
  background: var(--bg);
  padding: 28px 24px;
}
.pnl-foot-num {
  font-size: 36px;
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1;
  color: var(--ink);
}
.pnl-foot-lbl {
  font-size: 13px;
  color: var(--ink-3);
  margin-top: 10px;
  letter-spacing: -0.005em;
}

/* ───── Function-grouped use cases ───── */
.uc-group {
  margin-top: 64px;
}
.uc-group + .uc-group { margin-top: 40px; }
.uc-group-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 24px;
  padding-bottom: 20px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--line);
}
.uc-group-num {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--ink-4);
  font-variant-numeric: tabular-nums;
}
.uc-group-title {
  font-size: clamp(24px, 2.4vw, 32px);
  font-weight: 600;
  letter-spacing: -0.018em;
  margin: 4px 0 0;
  line-height: 1.15;
}
.uc-group-blurb {
  color: var(--ink-3);
  font-size: 15px;
  max-width: 42ch;
  text-align: right;
  margin: 0;
  line-height: 1.45;
}

@media (max-width: 960px) {
  .hero-stats { grid-template-columns: 1fr 1fr; }
  .hero-stat { border-bottom: 1px solid var(--line); }
  .hero-stat:nth-child(2) { border-right: 0; }
  .pnl-row, .pnl-row.pnl-header {
    grid-template-columns: 1.4fr 1fr 1fr;
    padding: 14px 18px;
  }
  .pnl-cell.delta, .pnl-cell.agents { display: none; }
  .pnl-table.is-compact .pnl-row, .pnl-table.is-compact .pnl-row.pnl-header { grid-template-columns: 1.6fr 1fr 1fr; }
  .pnl-foot { grid-template-columns: 1fr 1fr; }
  .uc-group-head { flex-direction: column; align-items: flex-start; }
  .uc-group-blurb { text-align: left; }
}

/* ───── Verticals ("Commerce, end to end") ───── */
.verts {
  background: linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 100%);
  border-top: 1px solid var(--line);
}
.verts-head {
  display: grid;
  grid-template-columns: 160px 1fr 1fr;
  gap: 48px;
  align-items: flex-start;
  padding-bottom: 64px;
  border-bottom: 1px solid var(--line);
}
.verts-eyebrow,
.caps-eyebrow {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.12em;
  color: var(--accent);
  padding-top: 14px;
}
.verts-title,
.caps-title { margin: 0; }
.verts-title-em,
.caps-title-em {
  font-weight: 400;
  font-style: italic;
  color: var(--accent);
  letter-spacing: -0.025em;
}
.verts-blurb,
.caps-blurb {
  color: var(--ink-3);
  margin: 0;
  font-size: 15px;
  line-height: 1.55;
  max-width: 38ch;
  padding-top: 12px;
}
.verts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0;
  margin-top: 0;
}
.vert-card {
  position: relative;
  padding: 56px 40px 48px;
  border-right: 1px solid var(--line);
}
.vert-card:last-child { border-right: 0; }
.vert-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--accent-soft);
  color: var(--accent);

}

  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.018em;
  margin: 0 0 12px;
}
.cap-blurb {
  color: var(--ink-3);
  font-size: 15px;
  line-height: 1.55;
  margin: 0;
  max-width: 38ch;

/* ───── Use case filter (radio segmented) ───── */

@media (max-width: 960px) {

  .vert-card:last-child, .cap-card:last-child { border-bottom: 0; }

/* ───── Apple-style alternating feature blocks ───── */
.feat {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
  padding: 100px 0;
}
.feat.is-reverse { direction: rtl; }

/* small text */

/* divider */

/* Tabs reveal animation */

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* responsive */
@media (max-width: 960px) {
  .mode-stage { grid-template-columns: 1fr; }
  .uc-grid { grid-template-columns: repeat(6, 1fr); }

  .intg-strip { grid-template-columns: repeat(4, 1fr); }
  .logos { grid-template-columns: repeat(3, 1fr); }
  .stat-row { grid-template-columns: 1fr; }
}

/* ═══════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════ */

/* ───── Portfolio proof strip (credibility) ───── */
.pproof { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--bg-soft); }

.pproof-stat-num { font-size: clamp(30px, 3.4vw, 46px); font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }

@media (max-width: 860px) { .pproof-stats { grid-template-columns: 1fr 1fr; } .pproof-stat:nth-child(2) { border-right: 0; } .pproof-stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); } }

/* ───── "What if every brand…" — 3 step ───── */

.cs { background: linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 30%); border-top: 1px solid var(--line); }
.cs-head { text-align: center; max-width: 720px; margin: 0 auto; }

.cs-bar { display: flex; align-items: center; gap: 16px; padding: 20px 30px; border-bottom: 1px solid var(--line); background: linear-gradient(100deg, var(--accent-soft), transparent 62%); flex-wrap: wrap; }

.cs-pill.is-conf { color: #c2410c; border-color: rgba(194,65,12,0.28); background: rgba(232,118,99,0.09); }
.cs-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,0.16); }

/* TLDR */
.cs-tldr { padding: 34px 30px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1.35fr 1fr 1fr 1fr; gap: 28px; align-items: center; background: linear-gradient(90deg, var(--accent-soft), transparent 70%); }

.cs-big-lbl { font-size: 12.5px; color: var(--ink-3); margin-top: 11px; line-height: 1.35; max-width: 18ch; }
@media (max-width: 900px) { .cs-tldr { grid-template-columns: 1fr 1fr; } .cs-tldr-lead { grid-column: 1 / -1; } }

/* chart grid */
.cs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }

.wm-rows { display: flex; flex-direction: column; gap: 18px; }

.cs-kicker-ic { width: 42px; height: 42px; border-radius: 11px; flex: none; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }

/* ───── Why us — vs in-house ───── */

@media (max-width: 760px) { .why-grid { grid-template-columns: 1fr; } }

/* ───── Enterprise / security trio ───── */
.ent { background: var(--bg-soft); border-top: 1px solid var(--line); }

.ent-card { border: 1px solid var(--line); border-radius: 20px; padding: 30px 28px; background: var(--bg); }
.ent-ic { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
.ent-t { font-size: 19px; font-weight: 650; letter-spacing: -0.015em; margin: 0 0 10px; color: var(--ink); }
.ent-d { font-size: 14.5px; line-height: 1.5; color: var(--ink-3); margin: 0; text-wrap: pretty; }
@media (max-width: 860px) { .ent-grid { grid-template-columns: 1fr; } }

/* ───── Hero product frame (Coframe-style living visual) ───── */
.hero-stage { position: relative; animation: heroFloat 8s ease-in-out infinite; }

  background: radial-gradient(46% 52% at 74% 14%, var(--accent-soft), transparent 70%), radial-gradient(42% 46% at 10% 88%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 72%), radial-gradient(40% 40% at 92% 80%, color-mix(in srgb, #8b5cf6 12%, transparent), transparent 70%);
  animation: heroAurora 14s ease-in-out infinite; }

  background: radial-gradient(38% 40% at 30% 20%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%); animation: heroAurora2 18s ease-in-out infinite; }
@keyframes heroAurora { 0%, 100% { transform: translate(0,0) scale(1); opacity: 0.9; } 33% { transform: translate(3%, -2.5%) scale(1.09); opacity: 1; } 66% { transform: translate(-2.5%, 2%) scale(1.04); opacity: 0.82; } }
@keyframes heroAurora2 { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(5%, 4%) scale(1.14); } }
@media (prefers-reduced-motion: reduce) { .hero-stage::before, .hero-stage::after { animation: none; } }
.prodframe { position: relative; z-index: 2; border-radius: 18px; background: var(--bg); border: 1px solid var(--line-strong); box-shadow: var(--shadow-lg); overflow: hidden; }
.prodframe-bar { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; background: var(--bg-elevated); border-bottom: 1px solid var(--line); }

.cstud-runs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

  background: linear-gradient(118deg, color-mix(in srgb, var(--accent) 92%, #000) 0%, var(--accent) 46%, color-mix(in srgb, var(--accent) 58%, #fff) 100%);

/* ═══ Case-study format switcher ═══ */
.csfmt-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 34px; }
.csfmt-pill { font: inherit; font-size: 13px; font-weight: 550; letter-spacing: -0.01em; color: var(--ink-2); white-space: nowrap;
  padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--bg);
  cursor: pointer; transition: color .16s ease, background .16s ease, border-color .16s ease; }
.csfmt-pill:hover { color: var(--ink); border-color: var(--ink-3); }
.csfmt-pill.is-active { color: #fff; background: var(--ink); border-color: var(--ink); }
.cs-stage { margin-top: 26px; animation: csStageIn .42s cubic-bezier(.2,.8,.2,1); }
@keyframes csStageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* shared bits */
.csv-name, .csb-name, .csn-name, .cse-name { font-size: 0; }
.csv-tag, .csb-tag, .csn-tag, .cse-tag { display: inline-block; margin-left: 8px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 3px 7px; border-radius: 5px; vertical-align: middle; }

/* ── 1 · Stacked cards ── */
.csv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.csv-card { position: relative; display: flex; flex-direction: column; padding: 26px 24px 22px; border: 1px solid var(--line-strong);
  border-radius: 20px; background: var(--bg); box-shadow: var(--shadow-sm); overflow: hidden;
  opacity: 0; transform: translateY(24px); }
.csv-grid.is-in .csv-card { animation: cstudIn .58s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--ci,0) * 0.13s); }
.csv-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 50%, #fff)); }
.csv-head { display: flex; align-items: center; gap: 9px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.csv-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); flex: none; }
.csv-name { font-size: 16px !important; font-weight: 650; letter-spacing: -0.02em; color: var(--ink); }
.csv-metrics { display: flex; flex-direction: column; gap: 16px; padding: 22px 0; flex: 1; }
.csv-metric { display: flex; flex-direction: column; gap: 3px; }
.csv-v { font-size: 30px; font-weight: 680; letter-spacing: -0.03em; line-height: 1;
  background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--ink))); -webkit-background-clip: text; background-clip: text; color: transparent; }
.csv-l { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.csv-foot { display: flex; flex-direction: column; gap: 9px; padding-top: 18px; border-top: 1px solid var(--line); }
.csv-runs-k { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-4); }
.csv-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.csv-chip, .csb-chip, .csn-chip, .cse-chip, .cstud-tool { font-size: 11.5px; font-weight: 550; color: var(--ink-2); padding: 4px 10px; border-radius: 7px; background: var(--bg-soft); border: 1px solid var(--line); }

/* ── 2 · Big-number hero rows ── */
.csb-list { display: flex; flex-direction: column; gap: 16px; }
.csb-row { position: relative; display: grid; grid-template-columns: minmax(220px, 0.9fr) 1.4fr; align-items: center; gap: 36px;
  padding: 30px 34px; border: 1px solid var(--line-strong); border-radius: 20px; background: var(--bg); box-shadow: var(--shadow-sm); overflow: hidden;
  opacity: 0; transform: translateY(24px); }
.csb-list.is-in .csb-row { animation: cstudIn .58s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--ci,0) * 0.14s); }
.csb-row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #fff)); }
.csb-hero { display: flex; flex-direction: column; gap: 6px; padding-right: 30px; border-right: 1px solid var(--line); }
.csb-hero-v { font-size: clamp(38px, 4.6vw, 60px); font-weight: 700; letter-spacing: -0.035em; line-height: 0.95;
  background: linear-gradient(160deg, var(--accent), color-mix(in srgb, var(--accent) 58%, var(--ink))); -webkit-background-clip: text; background-clip: text; color: transparent; }
.csb-hero-l { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.csb-side { display: flex; flex-direction: column; gap: 16px; }
.csb-name { font-size: 17px !important; font-weight: 640; letter-spacing: -0.02em; color: var(--ink); display: flex; align-items: center; }
.csb-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); margin-right: 10px; }
.csb-subs { display: flex; gap: 30px; }
.csb-sub { display: flex; flex-direction: column; gap: 3px; }
.csb-sub-v { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; color: var(--ink); }
.csb-sub-l { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }
.csb-runs { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
.csb-runs-k, .csn-tools-k { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-4); margin-right: 3px; }

/* ── 3 · Bento ── */
.csn-grid { display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: 1fr; gap: 16px; }
.csn-tile { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 22px; padding: 26px 26px 24px;
  border: 1px solid var(--line-strong); border-radius: 20px; background: var(--bg); box-shadow: var(--shadow-sm); overflow: hidden;
  opacity: 0; transform: translateY(24px); }
.csn-grid.is-in .csn-tile { animation: cstudIn .58s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--ci,0) * 0.13s); }
.csn-tile.is-lead { grid-row: span 2; background: radial-gradient(130% 100% at 100% 0%, var(--accent-soft), transparent 60%), var(--bg); border-color: color-mix(in srgb, var(--accent) 26%, var(--line-strong)); }
.csn-tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #fff)); }
.csn-top { display: flex; flex-direction: column; gap: 12px; }
.csn-name { font-size: 16px !important; font-weight: 650; letter-spacing: -0.02em; color: var(--ink); display: flex; align-items: center; }
.csn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); margin-right: 9px; flex: none; }
.csn-tools { display: flex; flex-wrap: wrap; gap: 6px; }
.csn-metrics { display: flex; flex-wrap: wrap; gap: 18px 26px; align-items: flex-end; }
.csn-metric { display: flex; flex-direction: column; gap: 3px; }
.csn-metric.is-hero .csn-v { font-size: clamp(34px, 3.4vw, 46px); }
.csn-tile.is-lead .csn-metrics { flex-direction: column; align-items: flex-start; gap: 20px; }
.csn-tile.is-lead .csn-metric.is-hero .csn-v { font-size: clamp(46px, 5vw, 68px); }
.csn-v { font-size: 24px; font-weight: 680; letter-spacing: -0.03em; line-height: 0.95;
  background: linear-gradient(160deg, var(--accent), color-mix(in srgb, var(--accent) 58%, var(--ink))); -webkit-background-clip: text; background-clip: text; color: transparent; }
.csn-l { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }

/* ── 4 · Terminal ── */
.cst-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.cst-card { border-radius: 14px; overflow: hidden; border: 1px solid #20242e; background: #14171e; box-shadow: var(--shadow-md);
  opacity: 0; transform: translateY(24px); font-family: var(--mono, ui-monospace, "SF Mono", Menlo, monospace); }
.cst-list.is-in .cst-card { animation: cstudIn .58s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--ci,0) * 0.13s); }
.cst-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #1b1f28; border-bottom: 1px solid #262b36; }
.cst-lights { display: flex; gap: 6px; }
.cst-lights i { width: 10px; height: 10px; border-radius: 50%; background: #353b47; }
.cst-lights i:first-child { background: var(--accent); }
.cst-title { font-size: 11.5px; color: #8b93a3; letter-spacing: -0.01em; }
.cst-body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 9px; font-size: 12.5px; line-height: 1.4; }
.cst-cmd { color: #9aa3b2; }
.cst-line { display: flex; align-items: center; gap: 8px; color: #cdd3de; }
.cst-arrow { color: var(--accent); }
.cst-key { color: #8b93a3; }
.cst-dots { flex: 1; border-bottom: 1px dotted #2c323d; margin: 0 2px; transform: translateY(-3px); }
.cst-val { color: #fff; font-weight: 600; }
.cst-done { margin-top: 4px; color: #7e8696; }
.cst-ok { color: #3fd07f; }
.cst-cursor { display: inline-block; width: 8px; height: 15px; background: var(--accent); margin-left: 6px; animation: cstBlink 1.05s steps(2) infinite; }
@keyframes cstBlink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }

/* ── 5 · Expandable ── */
.cse-list { display: flex; flex-direction: column; gap: 12px; }
.cse-row { position: relative; border: 1px solid var(--line-strong); border-radius: 16px; background: var(--bg); box-shadow: var(--shadow-sm); overflow: hidden;
  opacity: 0; transform: translateY(20px); transition: border-color .2s ease; }
.cse-list.is-in .cse-row { animation: cstudIn .5s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--ci,0) * 0.1s); }
.cse-row.is-open { border-color: color-mix(in srgb, var(--accent) 36%, var(--line-strong)); }
.cse-head { width: 100%; display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 24px;
  padding: 22px 26px; background: none; border: 0; cursor: pointer; font: inherit; text-align: left; }
.cse-name { font-size: 17px !important; font-weight: 640; letter-spacing: -0.02em; color: var(--ink); display: flex; align-items: center; }
.cse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); margin-right: 11px; flex: none; }
.cse-lead { font-size: 22px; font-weight: 680; letter-spacing: -0.025em; color: var(--accent); display: flex; align-items: baseline; gap: 9px; }
.cse-lead-l { font-size: 12px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
.cse-chev { color: var(--ink-3); display: flex; transition: transform .28s cubic-bezier(.2,.8,.2,1); }
.cse-row.is-open .cse-chev { transform: rotate(180deg); color: var(--accent); }
.cse-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s cubic-bezier(.2,.8,.2,1); }
.cse-row.is-open .cse-panel { grid-template-rows: 1fr; }
.cse-panel-in { overflow: hidden; }
.cse-row.is-open .cse-panel-in { padding: 0 26px 24px; }
.cse-metrics { display: flex; gap: 40px; padding-top: 4px; border-top: 1px solid var(--line); padding-top: 22px; }
.cse-metric { display: flex; flex-direction: column; gap: 4px; }
.cse-v { font-size: 30px; font-weight: 680; letter-spacing: -0.03em; line-height: 1;
  background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--ink))); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cse-l { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.cse-runs { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 20px; }
.cse-runs-k { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-4); margin-right: 3px; }

@media (prefers-reduced-motion: reduce) {
  .csv-card, .csb-row, .csn-tile, .cst-card, .cse-row { opacity: 1 !important; transform: none !important; animation: none !important; }
  .cs-stage { animation: none; }
}
@media (max-width: 980px) {
  .csv-grid, .cst-list { grid-template-columns: 1fr 1fr; }
  .csn-grid { grid-template-columns: 1fr; }
  .csn-tile.is-lead { grid-row: auto; }
}
@media (max-width: 720px) {
  .csv-grid, .cst-list { grid-template-columns: 1fr; }
  .csb-row { grid-template-columns: 1fr; gap: 22px; }
  .csb-hero { border-right: 0; border-bottom: 1px solid var(--line); padding-right: 0; padding-bottom: 20px; }
  .cse-head { grid-template-columns: 1fr auto; gap: 14px; }
  .cse-lead { display: none; }
  .cse-metrics { gap: 26px; flex-wrap: wrap; }
}

/* ═══ Makeshift animations (terminal × cards) ═══ */
/* shared flip mechanics */
.mflip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; perspective: 1800px; }
.mflip { height: 388px; }
.mflip2-list { display: flex; flex-direction: column; gap: 16px; perspective: 2400px; }
.mflip2 { height: 176px; }
.mflip-appear { width: 100%; height: 100%; opacity: 0; transform: translateY(22px) scale(.965); }
.mflip-grid.is-run .mflip-appear, .mflip2-list.is-run .mflip-appear { animation: mAppear .5s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--appear); }
.mflip-inner { position: relative; width: 100%; height: 100%; }
.mflip-face { position: absolute; inset: 0; border-radius: 16px; overflow: hidden; }
.mflip-face.mflip-front { opacity: 1; }
.mflip-face.mflip-back { opacity: 0; transform: translateY(10px) scale(1.05); filter: blur(8px); }
.mflip-grid.is-run .mflip-front, .mflip2-list.is-run .mflip-front { animation: mResolveOut .55s cubic-bezier(.4,0,.2,1) forwards; animation-delay: var(--flip); }
.mflip-grid.is-run .mflip-back, .mflip2-list.is-run .mflip-back { animation: mResolveIn .7s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--flip) + .1s); }
@keyframes mAppear { to { opacity: 1; transform: none; } }
@keyframes mResolveOut { to { opacity: 0; transform: translateY(-8px) scale(.965); filter: blur(6px); } }
@keyframes mResolveIn { to { opacity: 1; transform: none; filter: blur(0); } }
@keyframes mLine { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: none; } }
/* terminal cards sit flush inside a flip face */
.mflip-face .cst-card { opacity: 1 !important; transform: none !important; height: 100%; box-shadow: none; border-radius: 16px; }
.mflip-face .cst-body { height: calc(100% - 38px); }
.mflip-face .csv-card, .mflip-face .csb-row { height: 100%; box-shadow: none; }
/* the back card stays put (no list-entry animation) */
.csv-card.csv-static, .csb-row.csb-static { opacity: 1 !important; transform: none !important; animation: none !important; }
/* run the terminal lines on reveal */
.mflip-grid.is-run .cst-line, .mflip2-list.is-run .cst-line, .m4-list.is-run .cst-line { opacity: 0; }
.mflip-grid.is-run .cst-line, .mflip2-list.is-run .cst-line { animation: mLine .32s ease forwards; animation-delay: calc(var(--linebase) + var(--li) * .26s); }
.m4-list.is-run .cst-line { animation: mLine .32s ease forwards; animation-delay: calc(var(--linebase) + var(--li) * .24s); }

/* wide terminal (makeshift 2 front) */
.cstw .cstw-body { gap: 14px; }
.cstw-out { display: flex; flex-wrap: wrap; gap: 8px 30px; }
.cstw-line { gap: 8px; }
.cstw-line .cst-val { margin-left: 2px; }

/* makeshift 3 — card with mini terminal */
.m3-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.m3-card { position: relative; display: flex; flex-direction: column; gap: 16px; padding: 24px 22px 20px; border: 1px solid var(--line-strong);
  border-radius: 20px; background: var(--bg); box-shadow: var(--shadow-sm); overflow: hidden; opacity: 0; transform: translateY(22px); }
.m3-grid.is-run .m3-card { animation: cstudIn .55s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--ci,0) * .13s); }
.m3-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 50%, #fff)); }
.m3-head { display: flex; align-items: center; gap: 9px; }
.m3-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); flex: none; }
.m3-term { border-radius: 12px; overflow: hidden; border: 1px solid #20242e; background: #14171e; font-family: var(--mono, ui-monospace, "SF Mono", Menlo, monospace); }
.m3-term-bar { display: flex; align-items: center; gap: 7px; padding: 7px 12px; background: #1b1f28; border-bottom: 1px solid #262b36; font-size: 10.5px; color: #8b93a3; letter-spacing: -0.01em; }
.m3-live { width: 7px; height: 7px; border-radius: 50%; background: #3fd07f; box-shadow: 0 0 0 0 rgba(63,208,127,.6); animation: m3Pulse 1.6s ease-out infinite; }
@keyframes m3Pulse { 0% { box-shadow: 0 0 0 0 rgba(63,208,127,.55); } 70%,100% { box-shadow: 0 0 0 6px rgba(63,208,127,0); } }
.m3-term-body { position: relative; padding: 12px 12px 13px; display: flex; flex-direction: column; gap: 7px; font-size: 11.5px; line-height: 1.35; overflow: hidden; }
.m3-tl { display: flex; align-items: center; gap: 7px; color: #cdd3de; }
.m3-cmd { color: #9aa3b2; }
.m3-arrow { color: var(--accent); }
.m3-tv { margin-left: auto; color: #fff; font-weight: 600; }
.m3-dots3 { display: inline-flex; gap: 3px; margin-left: 2px; }
.m3-dots3 i { width: 3px; height: 3px; border-radius: 50%; background: #6b7384; animation: m3Blink 1.2s infinite; }
.m3-dots3 i:nth-child(2) { animation-delay: .2s; }
.m3-dots3 i:nth-child(3) { animation-delay: .4s; }
@keyframes m3Blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
